	// ✅ 파일 업로드 함수 추가
	async function uploadSignature(canvas, fileName) {
	  const dataUrl = canvas.toDataURL("image/png");
	  const blob = await (await fetch(dataUrl)).blob();
	  const formData = new FormData();
	  formData.append("file", blob, `${fileName}.png`);

	  try {
	    // 기존 파일 존재 여부 확인
	    const checkRes = await axios.head(`/sign/${fileName}.png`);
	    if (checkRes.status === 200) {
	      const confirmRes = await cuteAlert({
	        type: "question",
	        title: "파일 덮어쓰기",
	        message: `${fileName}.png 파일이 이미 존재합니다.\n덮어쓰시겠습니까?`,
	        confirmText: "예",
	        cancelText: "아니오"
	      });
	      /* if (confirmRes !== true) {
	        toastr.info("서명 저장을 취소했습니다.");
	        return;
	      } */
	      if (confirmRes !== true) {
	          // ✅ 아니오 클릭 시 캔버스 초기화
	          const ctx = canvas.getContext("2d");
	          ctx.clearRect(0, 0, canvas.width, canvas.height);
	          ctx.fillStyle = "#fff";  // 흰 배경으로 다시 채움
	          ctx.fillRect(0, 0, canvas.width, canvas.height);
	          // imgEl.src = ""; // 🧹 이미지 미리보기 초기화 - 그린거 보고싶으면 제거
	          toastr.info("서명 덮어쓰기를 취소했습니다.");
	          return false; // 업로드 중단
	        }
	    }
	  } catch (e) {
	    // 파일 없음 → 새로 저장
	  }

	  // 업로드 요청
	  await axios.post("/api/v1/stock/uploadSign", formData, {
	    headers: { "Content-Type": "multipart/form-data" },
	    withCredentials: true
	  });
	  // ✅ 업로드 후 새 이미지 즉시 반영 (캐시 방지용)
	  const imgEl = fileName === "finSign" ? fnImg : dptImg;
	  imgEl.src = `/sign/${fileName}.png?${Date.now()}`;

	  toastr.success(`${fileName}.png 업로드 완료`);
	}// END OF uploadSignature
	
	
	  // ===== 캔버스 초기화 =====
	  function initCanvas(canvas) {
	    const ctx = canvas.getContext("2d");
	    const dpr = window.devicePixelRatio || 1;
	    const rect = canvas.getBoundingClientRect();
	    canvas.width = rect.width * dpr;
	    canvas.height = rect.height * dpr;
	    ctx.scale(dpr, dpr);
	    ctx.fillStyle = "#fff";
	    ctx.fillRect(0, 0, rect.width, rect.height);
	    ctx.lineCap = "round";
	    ctx.lineJoin = "round";
	    ctx.lineWidth = 1.0;
	    ctx.strokeStyle = "#111";
	    return ctx;
	  }

	  function bindDraw(canvas, ctx) {
	    let drawing = false, lastX = 0, lastY = 0;
	    const toXY = (e) => {
	      const rect = canvas.getBoundingClientRect();
	      const p = e.touches ? e.touches[0] : e;
	      return { x: p.clientX - rect.left, y: p.clientY - rect.top };
	    };
	    const start = (e) => { drawing = true; const {x,y}=toXY(e); lastX=x; lastY=y; };
	    const move = (e) => {
	      if (!drawing) return;
	      const {x,y}=toXY(e);
	      ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(x,y); ctx.stroke();
	      lastX=x; lastY=y;
	    };
	    const end = ()=>drawing=false;
	    canvas.addEventListener('mousedown', start);
	    canvas.addEventListener('mousemove', move);
	    window.addEventListener('mouseup', end);
	    canvas.addEventListener('touchstart', e=>{e.preventDefault();start(e);},{passive:false});
	    canvas.addEventListener('touchmove', e=>{e.preventDefault();move(e);},{passive:false});
	    window.addEventListener('touchend', end);
	  }


	  // ===== 파일 URL 생성 =====
	 /*  function getSignUrl(fileName) {

	// 이미지 확장자가 뭐가 됐던 이름이 같으면 찾아오기
	async function loadSignImage(baseName, imgElem) {
		  const exts = ['.png', '.jpg', '.jpeg', '.gif', '.webp'];
		  let found = false;
		  for (const ext of exts) {
		    const url = `/sign/${baseName}${ext}`;
		    try {
		      const res = await fetch(url, { method: 'HEAD' }); // ✅ 별도 정의 불필요
		      if (res.ok) {
		        imgElem.src = url;
		        found = true;
		        return;
		      }
		    } catch (e) {
		      // 네트워크 오류 시 무시
		    }
		  }

		  /* console.warn("❌ 등록된 서명 이미지 없음");
		  imgElem.src = '/img/no-sign.png'; */
		  // ✅ 서명 이미지가 없을 경우
		  if (!found) {
		    console.warn(`❌ 등록된 ${baseName} 서명 이미지 없음`);
		    imgElem.src = '/img/no-sign.png';
		    toastr.warning(`등록된 ${baseName} 서명이 없습니다. 새로 등록해 주세요.`, "서명 없음");

		    // ✅ 자동으로 해당 서명 그리기 버튼 활성화
		    if (baseName === "finSign") {
		      finalBtn.style.display = "inline-block";   // 등록 버튼 노출
		      finalDrawBtn.style.display = "inline-block"; // 그리기 버튼 활성화
		      finalCanvas.style.display = "none"; // 캔버스는 일단 숨김
		    }
		    if (baseName === "empSign") {
		      deptBtn.style.display = "inline-block";
		      deptDrawBtn.style.display = "inline-block";
		      deptCanvas.style.display = "none";
		    }
		  } else {
		    // ✅ 이미 서명이 존재하면 등록 버튼 비활성화
		    if (baseName === "finSign") {
		      finalBtn.style.display = "none";
		      finalDrawBtn.style.display = "none";
		      finalCanvas.style.display = "none";
		    }
		    if (baseName === "empSign") {
		      deptBtn.style.display = "none";
		      deptDrawBtn.style.display = "none";
		      deptCanvas.style.display = "none";
		    }
		  }
		}

	async function createICData(){
			try{
				const res = await axios.post('/api/v1/stock/createICData', { withCredentials: true });
				 if (res.status === 200) {
				      toastr.success('결산 데이터가 생성되었습니다.');
				      
				      icListGrid.gridOptions.api.showLoadingOverlay();
				      
				      // 결산 목록 다시 불러오기
				      const listRes = await axios.get('/api/v1/stock/icList', { withCredentials: true });

				      //  데이터 갱신
				      icListGrid.gridOptions.api.setRowData(listRes.data);

				      // 최신 결산 자동 선택 + 상세 그리드 로드
				      if (listRes.data && listRes.data.length > 0) {
				        const latest = listRes.data[0]; // 최신 결산이 첫 번째라고 가정
				        selectedRow = latest.icCode;

				        // 해당 행 선택
				        icListGrid.gridOptions.api.forEachNode((node) => {
				          if (node.data.icCode === latest.icCode) {
				            node.setSelected(true);
				          }
				        });

				        // 상세데이터 자동 로드
				        await loadICDetailData(selectedRow);
				      }

				      // 로딩 종료
				      icListGrid.gridOptions.api.hideOverlay();
				    }
				  } 
				catch (err) {
				   console.error('❌ 결산 생성 실패:', err);
				    toastr.error('결산 생성 중 오류가 발생했습니다.', '에러', {
								   timeOut: 2000,
								   closeButton: true,
								   progressBar: true
				    			});
				    icListGrid.gridOptions.api.hideOverlay();
				  }
		
	}// END OF createICData

  // 재고 현황보고서 모달 호출 + Toast
	registerIcBtn.addEventListener('click', async (event) => {
		event.preventDefault(); // 페이지 새로고침 방지

		modalInTdDate.innerHTML = selectICDate; // 문서코드에 IC_DATE 입력
		const stat = await axios.post('/api/v1/stock/icList',{icCode : selectedRow},{ withCredentials: true });
		// console.log("stat.data : "+stat.data[0]?.icCode);
		if(stat.data.empSign){
			//fnImg.src = "/sign/"+stat.data[0].finalSign;
			dptImg.src = "/sign/"+stat.data[0].empSign;
			deptBtn.style.display = 'none'
		}
		if(selectedRowStatus == '결재완료'){
			  toastr.error('결재 완료된 내역입니다');
			  return;
		}
	        // confirm 먼저
	        const res = await cuteAlert({
	        	type: "question",
	            title: "결산 승인",
	            message: "정말 진행하시겠습니까?",
	            imgUrl: 'https://img.icons8.com/?size=100&id=103807&format=png&color=000000',
	            confirmText: "네",
	            cancelText: "아니오"
	        });
	       // console.log('cuteAlert result:', res);
	        if(res !== true) {
	            return; // 취소 시 함수 종료
	        }
	        const icsModalEl = document.getElementById('icsModal');
	        if (!icsModalEl) {
	            console.error("icsModal 요소를 찾을 수 없습니다.");
	            return;
	        }
	        
	        const icsModal = bootstrap.Modal.getOrCreateInstance(icsModalEl);
	        icsModal.show();
	        // 선택된 결산코드(selectedRow)를 모달 내부의 ag-Grid 데이터로 로드
	       if (typeof loadICDetailDataInModal === 'function') {
	            await loadICDetailDataInModal(selectedRow);
	        } 
	    
		  // console.log("JSON.stringify: "+JSON.stringify(payload, null, 2));
	
			  
	}); // END OF 재고 현황 보고서 모달 호출 이벤트
		
		
    // 재고현황보고서 모달 승인 클릭시 서명부 업데이트
	icsSubmitBtnInModal.addEventListener('click', async() => {
		console.log("현재 선택된 IC_CODE 값 : "+selectedRow);
		  try {
			  const icCode = selectedRow;
			  slicedFinalSignLink = fnImg.src.substr(fnImg.src.lastIndexOf('/')+1).split('?')[0];
			  slicedEmpSignLink = dptImg.src.substr(dptImg.src.lastIndexOf('/')+1).split('?')[0];
			  //console.log('slicedFinalSignLink : '+slicedFinalSignLink);
			  //console.log('slicedEmpSignLink : '+slicedEmpSignLink);
			  if(slicedFinalSignLink == 'insert'){slicedFinalSignLink = '';}
			  const payload = {
					icCode : icCode,
					finalSign : slicedFinalSignLink || null,
					empSign : slicedEmpSignLink || null
			  };
			  const isMissingSign = !payload.finalSign || !payload.empSign;
			  const alertMsg = isMissingSign
			    ? "서명되지 않은 부분이 존재합니다.\n진행하시겠습니까?"
			    : "정말 진행하시겠습니까?";
			  //console.log("payload is Array? : "+Array.isArray(payload));
			  // if(!payload.icCode || !payload.finalSign || !payload.empSign){ toastr.error('등록되지 않은 부분이 존재합니다!');  return;}
				  // confirm 먼저
			        const res = await cuteAlert({
			        	type: "question",
			            title: "결산 확인",
			            message: alertMsg,
			            imgUrl: 'https://img.icons8.com/?size=100&id=103807&format=png&color=000000',
			            confirmText: "네",
			            cancelText: "아니오"
			        });
			        console.log('cuteAlert result:', res);
			        if(res !== true) {
			            return; // 취소 시 함수 종료
			        }
			  console.log("📦 최종 payload:", JSON.stringify(payload, null, 2));
			  await axios.put("/api/v1/stock/signUpdate", payload,  {
				  headers: { 'Content-Type': 'application/json' },
				  withCredentials: true
				});
			  toastr.success('등록성공');
			  const icsModalEl = document.getElementById('icsModal');
		        const icsModal = bootstrap.Modal.getInstance(icsModalEl);
		        if (icsModal) icsModal.hide();
		        
		      const listRes = await axios.get('/api/v1/stock/icList', { withCredentials: true });
		      icListGrid.gridOptions.api.setRowData(listRes.data);
		      
		      // 등록된 행 다시 선택
		      icListGrid.gridOptions.api.forEachNode((node) => {
		    	  if (node.data.icCode === selectedRow) {
		    	    node.setSelected(true);
		    	  }
		    	});
		      
		   	  // 상세 그리드도 리로드
		      if (selectedRow) {
		        await loadICDetailData(selectedRow);
		      }
		   	  
		   	  // 모달 내부 그리드 초기화
		      if (initICModalGridOptions) {
		        initICModalGridOptions.api.setRowData([]);
		      }
			  
		      console.log("✅ 모든 그리드 리로드 완료");
		      
		  }catch(err){
			  alert('등록 실패: ' + err.message);
			  toastr.error('등록 실패: ' + err.message,{timeOut: 3000});
		  }
	}); // END OF 승인 이벤트

}); // END OF DOM CONTENT LOADED
