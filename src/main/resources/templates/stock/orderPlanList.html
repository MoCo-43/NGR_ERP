 	// 공통 모달 호출 함수
 	function initGrid(config) {
 	    const eGridDiv = document.getElementById(config.el);
 	    if (!eGridDiv) {
 	        console.error(`${config.el} div를 찾을 수 없습니다!`);
 	        return null;
 	    }
 		let gridApi = null;
 	    const gridOptions = {
 	        columnDefs: config.columnDefs || [],
 	        rowSelection: config.rowSelection || "single",
 	        pagination: true,
 	        paginationPageSize: config.paginationPageSize || 12,
 	        domLayout: config.domLayout || "normal",
 	        rowData: [],
 	        defaultColDef: {
 	            resizable: true,
 	            sortable: true,
 	            minWidth: 100,
 	        },
 	        onRowDoubleClicked: (event) => {
 	            if (typeof config.onRowDoubleClicked === "function") {
 	                config.onRowDoubleClicked(event);
 	            }
 	        },
 	       onRowClicked: (event) => {
	            if (typeof config.onRowClicked === "function") {
	                config.onRowClicked(event);
	            }
	        },
 	        onGridReady: (event) => {
 	            if (typeof config.onGridReady === "function") {
 	                config.onGridReady(event);
 	            }
 	            event.api.sizeColumnsToFit();
 	        },
 	    };

 	    new agGrid.Grid(eGridDiv, gridOptions);
 	    return { gridApi: gridOptions.api, gridOptions };
}// END OF FUNCTION

function initKoreanDatePicker(selector, options = {}) {
    flatpickr(selector, {
        locale: "ko",
        dateFormat: "Y-m-d",
        allowInput: true,
        enableTime: false,
        onReady: function(selectedDates, dateStr, instance) {
        	const btnWrapper = document.createElement("div");
            // 공통 스타일
            btnWrapper.style.cssText = `
            	 display: flex;
                justify-content: space-between; /* 좌우 끝 */
                width: 100%;                   /* 전체 너비 확보 */
                padding: 2px 6px;              /* 달력과 버튼 간 여백 */
                box-sizing: border-box;
                margin-top: 2px;
            `;

            // 오늘 버튼
            const todayBtn = document.createElement("button");
            todayBtn.type = "button";
            todayBtn.textContent = "오늘";
            todayBtn.className = "btn btn-outline-primary btn-sm"; // 테두리 보이게
            todayBtn.style.cssText = "font-size: 0.65rem; padding: 2px 6px;";
            todayBtn.addEventListener("click", () => {
                instance.setDate(new Date());
                loadFilteredData(); 
                instance.close();
            });

            // 초기화 버튼
            const clearBtn = document.createElement("button");
            clearBtn.type = "button";
            clearBtn.textContent = "초기화";
            clearBtn.className = "btn btn-outline-secondary btn-sm"; // 테두리 보이게
            clearBtn.style.cssText = "font-size: 0.65rem; padding: 2px 6px;";
            clearBtn.addEventListener("click", () => {
                instance.clear();
                loadFilteredData(); 
                instance.close();
            });

            // 버튼 붙이기
            btnWrapper.appendChild(clearBtn);
            btnWrapper.appendChild(todayBtn);

            instance.calendarContainer.appendChild(btnWrapper);
        },
        ...options
    });
}

//단위마다 "," 공통함수(문자 > 숫자 변환)
function numberFormatter(params) {
	  if (params.value == null || params.value === "") return "";
	  return Number(params.value).toLocaleString();
}
//강제 딜레이 부여
function debounce(func, wait = 300) {
	let timeout;
		return function(...args) {
		clearTimeout(timeout);
		timeout = setTimeout(() => func.apply(this, args), wait);
	}
}

                button.innerText = '조회';

                if (params.data.hasOrderSheet === 'Y') { // mapper.xml에서 Y/N로 가져오는 경우

                    button.addEventListener('click', () => {
                        const xpCode = params.data.xpCode;
                        const businessCode = params.data.businessCode;

                        // PDF 모달 열기
                        const iframe = document.querySelector('#orderModal iframe#pdfFrame');
                        iframe.src = `/api/v1/stock/orderSheet/${xpCode}/${businessCode}`;
                        const orderModal = new bootstrap.Modal(document.getElementById('orderModal'));
                        orderModal.show();
                    });
                } else {
                    button.classList.add('btn-secondary');
                    button.disabled = true;
                }

                return button;
            },
            width: 100
        }
    ],

	// 거래처 필터링 함수
	async function filterBusinessData({ cusKw, empKw, btKw, bcKw }) {
    try {
        let url = `/api/v1/stock/cusList/${compCode}`;
        const params = new URLSearchParams();

        // 값이 있을 때만 쿼리스트링에 추가
        if (cusKw) params.append("cusKw", cusKw);
        if (empKw) params.append("empKw", empKw);
        if (btKw)  params.append("btKw", btKw);
        if (bcKw)  params.append("bcKw", bcKw);

        const query = params.toString();
        if (query) url += `?${query}`;

        const res = await axios.get(url);
        if (gridApi) {
            gridApi.setRowData(res.data);
            gridApi.sizeColumnsToFit();
        }
    } catch (err) {
        console.error("거래처 다중 필터링 실패:", err);
        toastr.error("거래처 조회 중 오류 발생");
    }
  } // END OF FUNC
