<script th:inline="none">
document.addEventListener("DOMContentLoaded", () => {
	/**
	 * 공통 Grid 초기화 함수
	 * @param {Object} config - grid 설정 객체
	 * @param {string} config.el - grid를 붙일 div의 id
	 * @param {Array} config.columnDefs - 컬럼 정의
	 * @param {Function} [config.onRowDoubleClicked] - 행 더블클릭 이벤트 핸들러
	 * @param {Function} [config.onGridReady] - grid ready 이벤트 핸들러
	 * @returns {Object} { gridApi, gridOptions }
	 */
	// ------------------ 변수 초기화 ------------------
	const productModalEl = document.getElementById("productModal");
	const productModal = bootstrap.Modal.getOrCreateInstance(productModalEl);
	const businessModalEl = document.getElementById("businessModal");
	const businessModal = bootstrap.Modal.getOrCreateInstance(businessModalEl);
	const searchPartner = document.getElementById('businessPartner');
	const searchProduct = document.getElementById('productName');
	let productGrid = null; // 전역 변수
 	let gridOptions = null;
 	let gridCreated = false;
 	let gridApi = null;
 	let outDetailGridOptions = null;
 	let selectedRow = null; // 전역(이벤트 바깥)으로 선언
 	let doCode = null;
 	let productGridApi = null;
	let productGridOptions = null;
	let selectedProductRow = null; // 클릭한 행 저장용
	
	function initKoreanDatePicker(selector, options = {}) {
	    flatpickr(selector, {
	        locale: "ko",
	        dateFormat: "Y-m-d",
	        allowInput: true,
	        enableTime: false,
	        onReady: function(selectedDates, dateStr, instance) {
	        	const btnWrapper = document.createElement("div");
	            // 공통 스타일
	            btnWrapper.style.cssText = `
	            	 display: flex;
	                justify-content: space-between; /* 좌우 끝 */
	                width: 100%;                   /* 전체 너비 확보 */
	                padding: 2px 6px;              /* 달력과 버튼 간 여백 */
	                box-sizing: border-box;
	                margin-top: 2px;
	            `;

	            // 오늘 버튼
	            const todayBtn = document.createElement("button");
	            todayBtn.type = "button";
	            todayBtn.textContent = "오늘";
	            todayBtn.className = "btn btn-outline-primary btn-sm"; // 테두리 보이게
	            todayBtn.style.cssText = "font-size: 0.65rem; padding: 2px 6px;";
	            todayBtn.addEventListener("click", () => {
	                instance.setDate(new Date());
	                loadFilteredData(); 
	                instance.close();
	            });

	            // 초기화 버튼
	            const clearBtn = document.createElement("button");
	            clearBtn.type = "button";
	            clearBtn.textContent = "초기화";
	            clearBtn.className = "btn btn-outline-secondary btn-sm"; // 테두리 보이게
	            clearBtn.style.cssText = "font-size: 0.65rem; padding: 2px 6px;";
	            clearBtn.addEventListener("click", () => {
	                instance.clear();
	                loadFilteredData(); 
	                instance.close();
	            });

	            // 버튼 붙이기
	            btnWrapper.appendChild(clearBtn);
	            btnWrapper.appendChild(todayBtn);

	            instance.calendarContainer.appendChild(btnWrapper);
	        },
	        ...options
	    });
	}
	
	initKoreanDatePicker('#outboundDate');
	initKoreanDatePicker('#dueDate');
	
 	// 공통 모달 호출 함수
 	function initGrid(config) {
 	    const eGridDiv = document.getElementById(config.el);
 	    if (!eGridDiv) {
 	        console.error(`${config.el} div를 찾을 수 없습니다!`);
 	        return null;
 	    }
 		let gridApi = null;
 	    const gridOptions = {
 	        columnDefs: config.columnDefs || [],
 	        rowSelection: config.rowSelection || "single",
 	        pagination: true,
 	        paginationPageSize: config.paginationPageSize || 12,
 	        domLayout: config.domLayout || "normal",
 	        rowData: [],
 	        defaultColDef: {
 	            resizable: true,
 	            sortable: true,
 	            minWidth: 100,
 	        },
 	        onRowDoubleClicked: (event) => {
 	            if (typeof config.onRowDoubleClicked === "function") {
 	                config.onRowDoubleClicked(event);
 	            }
 	        },
 	       onRowClicked: (event) => {
	            if (typeof config.onRowClicked === "function") {
	                config.onRowClicked(event);
	            }
	        },
 	        onGridReady: (event) => {
 	            if (typeof config.onGridReady === "function") {
 	                config.onGridReady(event);
 	            }
 	            event.api.sizeColumnsToFit();
 	        },
 	    };

 	    new agGrid.Grid(eGridDiv, gridOptions);
 	    return { gridApi: gridOptions.api, gridOptions };
	}// END OF FUNCTION

	// 회사코드 불러오기

	//단위마다 "," 공통함수(문자 > 숫자 변환)
	function numberFormatter(params) {
		  if (params.value == null || params.value === "") return "";
		  return Number(params.value).toLocaleString();
	}
	  
	// 강제 딜레이 부여
	function debounce(func, wait = 300) {
			let timeout;
				return function(...args) {
				clearTimeout(timeout);
				timeout = setTimeout(() => func.apply(this, args), wait);
		}
	}

		 }finally{

	    // 거래처 모달 - 필터
	    document.querySelector(".bsmSearchBtn").addEventListener("click", async ()=>{
	    	 try {
	    	    	showLoader("gridBsModalWrapper","데이터를 불러오는 중입니다...");

	    	      // ✅ 서버로 요청 (axios GET 또는 POST)
	    	      const res = await axios.post(`/api/v1/stock/filteredCustomerList`, params, { withCredentials: true });
	    	      console.log("검색 결과:", res.data);

	    	      // ✅ ag-Grid에 데이터 반영

	    	      }

	    	    } catch (err) {
	    	      console.error("조회 오류:", err);
	    	      alert("데이터 조회 중 오류가 발생했습니다.");
	    	    } finally{
