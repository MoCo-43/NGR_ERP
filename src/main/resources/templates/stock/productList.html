 	    const eGridDiv = document.getElementById(config.el);

 	        console.error(`${config.el} div를 찾을 수 없습니다!`);
 	        return null;
 	    }
 		let gridApi = null;
 	    const gridOptions = {
 	        columnDefs: config.columnDefs || [],
 	        rowSelection: config.rowSelection || "single",
 	        pagination: true,
 	        paginationPageSize: config.paginationPageSize || 12,
 	        domLayout: config.domLayout || "normal",
 	        rowData: [],
 	        defaultColDef: {
 	            resizable: true,
 	            sortable: true,
 	            minWidth: 100,
 	        },
 	        onRowDoubleClicked: (event) => {
 	            if (typeof config.onRowDoubleClicked === "function") {
 	                config.onRowDoubleClicked(event);
 	            }
 	        },
 	       onRowClicked: (event) => {
	            if (typeof config.onRowClicked === "function") {
	                config.onRowClicked(event);
	            }
	        },
 	        onGridReady: (event) => {
 	            if (typeof config.onGridReady === "function") {
 	                config.onGridReady(event);
 	            }
 	            event.api.sizeColumnsToFit();
 	        },
 	    };

 	    new agGrid.Grid(eGridDiv, gridOptions);
 	    return { gridApi: gridOptions.api, gridOptions };

	    flatpickr(selector, {

	            	 display: flex;
	                justify-content: space-between; /* 좌우 끝 */

	                padding: 2px 6px;              /* 달력과 버튼 간 여백 */

	                margin-top: 2px;
	            `;
	
	            // 오늘 버튼
	            const todayBtn = document.createElement("button");
	            todayBtn.type = "button";
	            todayBtn.textContent = "오늘";
	            todayBtn.className = "btn btn-outline-primary btn-sm"; // 테두리 보이게
	            todayBtn.style.cssText = "font-size: 0.65rem; padding: 2px 6px;";

	            clearBtn.addEventListener("click", () => {
	                instance.clear();

	                instance.close();
	            });
	
	            // 버튼 붙이기
	            btnWrapper.appendChild(clearBtn);
	            btnWrapper.appendChild(todayBtn);
	
	            instance.calendarContainer.appendChild(btnWrapper);
	        },
	        ...options
	    });
	}

		function debounce(func, wait = 300) {
			    let timeout;
			    return function(...args) {
			        clearTimeout(timeout);
			        timeout = setTimeout(() => func.apply(this, args), wait);
			}
		}

	        if (params.node.rowPinned) return '합계'; // pinned row이면 합계 표시
	        return params.value;
	    },
	    
        colSpan: (params) => {
            if (params.node.rowPinned) return 7; // No + LOT + 제품코드 + 제품명 + 규격 + 거래처코드 + 거래처명 합치기
            return 1;
        },
	    cellStyle: (params) => {
	        if (params.node.rowPinned) {
	            return {
	                backgroundColor: '#93caf9', // 원하는 배경색
	                textAlign: 'center',         // 가운데 정렬
	                fontWeight: 'bold'           // 굵게
	            };
	        }
	        return null;
	    }
	    	
	    },
	    { headerName: "LOT", field: "lotCode" },
	    { headerName: "제품코드", field: "productCode" },
	    { headerName: "제품명", field: "productName" },
	    { headerName: "규격", field: "specification"},
	    { headerName: "거래처코드", field: "businessCode"},
	    { headerName: "거래처명", field: "businessPartner"},
	    { headerName: "잔여수량", field: "remainQty",valueFormatter: (params) => {
	        // 값이 없으면 "-"로 표시, 값이 있으면 천 단위 콤마
	        return params.value != null && params.value !== "" 
	            ? Number(params.value).toLocaleString() 
	            : "-";
	    },cellStyle: { textAlign: "right" },   // ✅ 우측 정렬
	    },
	    { headerName: "구매단가", field: "purchasePrice",valueFormatter: (params) => {
	        // 값이 없으면 "-"로 표시, 값이 있으면 천 단위 콤마
	        return params.value != null && params.value !== "" 
	            ? Number(params.value).toLocaleString() 
	            : "-";
	    },cellStyle: { textAlign: "right" },   // ✅ 우측 정렬
	    },
	    { headerName: "공급가액", field: "totalAmount", valueGetter: (params) => {
	        // ✅ 각 행의 공급가액 계산
	        if (params.node.rowPinned) return params.data.totalAmount;
	        const qty = params.data.remainQty || 0;
	        const price = params.data.purchasePrice || 0;
	        return qty * price;
	      },
	        valueFormatter: (params) => {
	        // 값이 없으면 "-"로 표시, 값이 있으면 천 단위 콤마
	        return params.value != null && params.value !== "" 
	            ? Number(params.value).toLocaleString() 
	            : "-";
	     },
	       cellStyle: { textAlign: "right" },   // ✅ 우측 정렬
	    },
	]; // END OF COLUMN 
	
	
	//그리드 초기화
	function initInboundGrid() {
	    const { gridOptions } = initGrid({
	        el: "inDetailGrid",
	        columnDefs: inDetailColumnDefs,
	        paginationPageSize: 20,
	        domLayout: "autoHeight"
	    });
	    inDetailGridOptions = gridOptions;
	} // END OF initInboundGrid
	
	initInboundGrid(); // 그리드 초기화 실행 후 그리드에 그리기
	async function loadInDetailData(productCode, productName){
		showLoader("gridDetailWrapper","데이터를 불러오는 중입니다...");
		let rowData = [];
		  // 1️ 상세 데이터 로딩 (이미지와 관계없이 바로)
			    try {
			        const resDetail = await axios.get(`/api/v1/stock/selectProductDetail/${compCode}/${productCode}`, { withCredentials: true });
			        console.log("LOT별 상세 데이터:", resDetail.data);
			        if (resDetail.data && resDetail.data.length > 0) {
			            rowData = resDetail.data;
			         	  // 합계 계산: pinnedBottomRowData 사용
			         	   // ✅ 총 공급가액 = 각 행의 remainQty * purchasePrice 합
							const totalAmount = resDetail.data.reduce(
							    (sum, r) => sum + ((r.remainQty || 0) * (r.purchasePrice || 0)), 0 );
					      const totalRow = {
					        no: '합계',
					        remainQty: resDetail.data.reduce((sum, r) => sum + r.remainQty, 0),
					        purchasePrice: resDetail.data.reduce((sum, r) => sum + r.purchasePrice, 0),
					        totalAmount: totalAmount,
					      };
					      inDetailGridOptions.api.setPinnedBottomRowData([totalRow]);
			        }else{
			        	toastr.error('LOT이 존재하지 않는 데이터입니다');
			        }
			        if (inDetailGridOptions && inDetailGridOptions.api) {
			            inDetailGridOptions.api.setRowData(resDetail.data);
			        	 // 데이터가 없으면 그리드 숨기기, 있으면 보이기
			            document.getElementById("inDetailGrid").style.display = rowData.length > 0 ? "block" : "none";
			                
			        }
			    } catch(err) {
			        console.error("상세 데이터 조회 실패:", err);
			        toastr.error("상세 데이터 조회 실패");
			    } finally{
			    	hideLoader("gridDetailWrapper");
			    }
		
		  // 2 이미지 요청
			 axios.get(`/api/v1/stock/selectProductImg/${compCode}/${productCode}`, { responseType: 'blob' })
		        .then(imgRes => {
		        	console.log("imgRes.data : "+imgRes.data);
		           const reader = new FileReader();
		            reader.onload = function(e) {
		                if (e.target.result) {
		                    prevImg.src = e.target.result;
		                    imageName.textContent = productName;
		                    imageCard.style.display = 'block';
		                }
		                	
		            };
		            reader.readAsDataURL(imgRes.data);
		            //console.log("imgRes.data : "+imgRes.data);
		        })
		        .catch(err => {
		            console.log("이미지 없음:", err);
		            toastr.error("No image has been uploaded.");
		            prevImg.src = "";
		            imageCard.style.display = 'none';
		        })
		        .finally(() => hideLoader("gridDetailWrapper")); // 로더는 여기서 종료
		  
	}// END OF loadInDetailData
	
	// 제품목록 조회 모달
	async function openProductModal() {
		 if (!productGrid) {
		        // 최초 초기화
		        productGrid = initGrid({
		            el: "productGrid",
		            columnDefs: [
		                { headerName: "제품코드", field: "productCode" },
		                { headerName: "제품명", field: "productName" },
		                { headerName: "규격", field: "specification" },
		            ],
		            onGridReady: async (event) => {
		                try {
		                	showLoader("gridModalWrapper","데이터를 불러오는 중입니다...");
		                    const res = await axios.get(`/api/v1/stock/productList/${compCode}`);
		                    event.api.setRowData(res.data);
		                } catch (err) {
		                    console.error("제품리스트 데이터 로드 실패:", err);
		                } finally{
		                	hideLoader("gridModalWrapper");
		                }
		            },
		            onRowDoubleClicked:  async (event) => {
		                // 모달 안에서 선택한 행의 제품명만 가져오기
		                document.getElementById("productName").value = event.data.productName;
		                productModal.hide();
		                await loadFilteredData(); // 여기서 자동 조회
		            }
		        });
		  } else {
		        // 이미 초기화된 Grid이면 기존 Grid를 재사용
		        try {
		        	showLoader("gridModalWrapper","데이터를 불러오는 중입니다...");
		            const res = await axios.get(`/api/v1/stock/productList/${compCode}`);
		            productGrid.gridOptions.api.setRowData(res.data);
		            productGrid.gridOptions.api.sizeColumnsToFit();
		        } catch (err) {
		            console.error("제품리스트 데이터 로드 실패:", err);
		        } finally {
		        	hideLoader("gridModalWrapper");
		        }
		    }
	    productModal.show();
	}
	
	// 제품명 INPUT 클릭시 모달 호출
	searchProduct.addEventListener('click' , async ()=>{
		openProductModal();
	});
	
	// 초기화 버튼 클릭시  - 전체 데이터 바인딩
	resetBtn.addEventListener('click' , async ()=>{
		try{
			 showLoader("gridWrapper" , "데이터를 불러오는 중입니다...");
			 showLoader("gridDetailWrapper" , "데이터를 초기화하는 중입니다...");
			 productName = document.getElementById("productName").value = "";
		     insDate = document.getElementById("insDate").value = "";
		     vatType = document.getElementById("vatType").value = "";	
		     const res = await axios.get(`/api/v1/stock/productList/${compCode}`, { withCredentials: true });
		     inListGrid.gridOptions.api.setRowData(res.data);
		}catch(err){
			alert(err);
		}finally{
			hideLoader("gridWrapper");
			hideLoader("gridDetailWrapper");
		}
	     
	});

	// 거래처 그리드 초기화
	function initBusinessGrid() {
	    const eGridDiv = document.getElementById('myGrid');
	    const columnDefs = [
	        { headerName: "거래처코드", field: "cusCode" },
	        { headerName: "거래처명", field: "cusName" },
	        { headerName: "담당자명", field: "empName" },
	        { headerName: "사업자번호", field: "bizNo" },
	        { headerName: "대표명", field: "ceoName" },
	        { headerName: "업태", field: "bizType" },
	        { headerName: "종목", field: "bizCategory" },
	        { headerName: "거래처주소", field: "addr" }
	    ];

	    const gridOptions = {
	        columnDefs,
	        rowSelection: "single",
	        pagination: true,
	        domLayout: 'normal',
	        rowData: [],
	        onGridReady: (event) => {
	            gridApi = event.api;
	            gridApi.sizeColumnsToFit();
	            loadBusinessData();
	        },
	        defaultColDef: {
	            resizable: true,   // 컬럼 너비 조절 가능
	            sortable: true,    // 정렬 가능
	            minWidth: 100,     // 최소 너비
	        },
	        onRowDoubleClicked: async (event) => {
	        	document.getElementById("businessPartner").value = event.data.cusName;
	            bootstrap.Modal.getOrCreateInstance(document.getElementById("businessModal")).hide();
	            await loadFilteredData(); // 여기서 자동 조회
	        }
	    };
	    new agGrid.Grid(eGridDiv, gridOptions);
	}
	
	// 거래처 데이터 로드
	async function loadBusinessData() {
	    try {
	        const res = await axios.get(`/api/v1/stock/cusList/${compCode}`);
	        if (gridApi) {
	            gridApi.setRowData(res.data);
	            gridApi.sizeColumnsToFit();
	        }
	    } catch (err) { console.error(err); }
	}
	
	

});
