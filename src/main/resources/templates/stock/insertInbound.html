<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
     xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	 layout:decorate="~{layout/base}">
<head>
  <meta charset="UTF-8">
  <title layout:fragment="title">입고 등록</title>
  <th:block layout:fragment="head_extra">
     <!-- Bootstrap CSS -->
  	<!--  base에 있는 버전과 달라서 강제 주입 --> 
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous"
  />
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <!-- AG Grid CSS (Quartz) -->
   <link
     rel="stylesheet"
     href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.1/styles/ag-grid.css"
    />
   <link
     rel="stylesheet"
     href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.1/styles/ag-theme-quartz.css"
   />
   <!-- TOASTR -->
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.css" integrity="sha512-3pIirOrwegjM6erE5gPSwkUzO+3cTjpnV9lexlNZqvupR64iZBnOOTiiLPb9M36zpMScbmUNIcHUqKD47M719g==" crossorigin="anonymous" referrerpolicy="no-referrer" />
   <!-- CSS -->
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
   <!-- CSS(confirm alert + Quartz) -->
   <link rel="stylesheet" href="/style/confirm.css" />
   
  </th:block>
</head>
<body>
<section layout:fragment="content">
<!-- 컨테이너 시작 -->
<div class="card shadow">
  <!-- 마스터 카드 -->
  <!-- <div class="card shadow-sm mb-4"> -->
    <div class="card-header py-3 d-flex align-items-center justify-content-between">
      <h6 class="mb-0 font-weight-bold text-primary">입고 등록 페이지</h6>
    </div>
  <!-- </div>  -->

  <!-- 폼 카드 -->
  <!-- <div class="card shadow-sm">  -->
    <div class="card-body">
    <div class="btn-bar">
    	 <!-- 버튼 영역 (폼 전체 최상단 오른쪽) -->
      <div class="d-flex justify-content-end mb-3">
      	<button type="button" class="btn btn-dark me-2" id="searchBtn">발주조회</button>
	    <button type="button" class="btn btn-primary me-2" id="submitBtn">등록</button>
	    <button type="reset" class="btn btn-danger" form="insertList">초기화</button>
       </div>
    </div>
    
      <form class="row g-3" id="insertList" enctype="application/x-www-form-urlencoded">
      <div class="col-md-3">
          <label for="compCode" class="form-label">회사코드</label>
          <input type="text" class="form-control" id="compCode" name="compCode">
        </div>
        <div class="col-md-3">
          <label for="orderCode" class="form-label">발주코드</label>
          <input type="text" class="form-control" id="orderCode" name="orderCode" placeholder="발주코드 기입">
        </div>
         <div class="col-md-3">
          <label for="businessCode" class="form-label">거래처코드</label>
          <input type="text" class="form-control" id="businessCodeInput" name="businessCode">
        </div>
        <div class="col-md-3">
          <label for="businessPartner" class="form-label">거래처명</label>
          <input type="text" class="form-control" id="businessPartnerInput" name="businessPartner">
        </div>
        <div class="col-md-3">
          <label for="dueDate" class="form-label">납기일자</label>
          <input type="date" class="form-control" id="dueDate" name="dueDate">
        </div>
        
      </form>
    </div>
  <!-- </div>  -->
  
  <div class="card shadow-sm mt-4">
  <div class="card-header bg-secondary text-white">
    <h5 class="mb-0">입고 제품 목록</h5>
  </div>
  <div class="card-body">
  <div id="gridWrapper" style="position: relative; width: 100%; height: 500px;">
      <div id="inListGrid" class="ag-theme-quartz" style="width: 100%; height: 500px;"></div>
        <!-- 로딩 스피너 -->
		<div id="loader" class="loader-overlay" style="display: none;">
			<div class="spinner-border text-primary" role="status">
			   <span class="visually-hidden">Loading...</span>
			</div>
		</div>
  </div>
  </div>
  </div>
  
  
  
  
  <!-- Toast (닫기 버튼 제거) -->
<div class="position-fixed top-0 end-0 p-3" style="z-index: 11">
  <div id="successToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-body" id="toastMessage">등록 성공!</div>
  </div>
</div>
  
  <!-- 컨테이너 종료 -->
</div>

   <!-- 모달 include              경로             ::  div id 부분  -->   
  <div th:replace="~{stock/modals/orderListModal :: orderListModal}"></div>
  
</section>
  
<th:block layout:fragment="body_extra">
<!-- 세션 정보 저장 -->
<script th:inline="javascript">
    const loginName = /*[[${#authentication.principal.empLoginVO.name}]]*/ "";
    const compCode = /*[[${#authentication.principal.empLoginVO.matNo}]]*/ "";
</script>
 <!-- Axios 등록 -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
 <!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
 <!-- ag-Grid JS -->
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@30.2.1/dist/ag-grid-community.min.noStyle.js"></script>
 <!-- toastr -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js" integrity="sha512-VEd+nq25CkR676O+pLBnDW09R7VQX9Mdiij052gVCp5yVH3jGtH70Ho/UUv4mJDsEdTvqRCFZg0NKGiojGnUCw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
 <!-- cuteAlert js -->
<script src="/js/cuteAlert.js"></script>
<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<!-- 한국어 locale -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ko.js"></script>

  <!-- 스크립트 -->
<script th:inline="none">
document.addEventListener("DOMContentLoaded", () => {
	// 현재 날짜로 초기 입력
	function initToday(){
		const today = new Date();
		const yyyy = today.getFullYear();
		const mm = String(today.getMonth() + 1).padStart(2, '0'); // 월은 0~11이므로 +1
		const dd = String(today.getDate()).padStart(2, '0');
		document.querySelector('#insDate').value = `${yyyy}-${mm}-${dd}`;
	}
	
	const inListGrid = document.getElementById('inListGrid');
	const addRowBtn = document.getElementById('addRowBtn');
	const tableBody = document.querySelector('#orderItemsTable tbody');
	const taxSelect = document.getElementById('taxType'); // 상단 세율 select
	const searchBtn = document.getElementById('searchBtn'); // 발주계획 조회 버튼
	const form = document.getElementById('insertList');
	const submitBtn = document.getElementById('submitBtn');
	const toastEl = document.getElementById('successToast');
	const toast = new bootstrap.Toast(toastEl);
	//
 	let gridApi = null;
 	let gridOptions = null;
 	let orderListGridApi = null;
	let orderDetailGridApi = null;
	let orderDetailGridOptions = null;
	let rowData = null;
	let productGridApi = null;
	let productGridOptions = null;
	
 	// 공통 모달 호출 함수
 	function initGrid(config) {
 	    const eGridDiv = document.getElementById(config.el);
 	    if (!eGridDiv) {
 	        console.error(`${config.el} div를 찾을 수 없습니다!`);
 	        return null;
 	    }
 		let gridApi = null;
 	    const gridOptions = {
 	        columnDefs: config.columnDefs || [],
 	        rowSelection: config.rowSelection || "single",
 	        pagination: true,
 	        paginationPageSize: config.paginationPageSize || 12,
 	        domLayout: config.domLayout || "normal",
 	        rowData: [],
 	        defaultColDef: {
 	            resizable: true,
 	            sortable: true,
 	            minWidth: 100,
 	        },
 	        onRowDoubleClicked: (event) => {
 	            if (typeof config.onRowDoubleClicked === "function") {
 	                config.onRowDoubleClicked(event);
 	            }
 	        },
 	       onRowClicked: (event) => {
	            if (typeof config.onRowClicked === "function") {
	                config.onRowClicked(event);
	            }
	        },
 	        onGridReady: (event) => {
 	            if (typeof config.onGridReady === "function") {
 	                config.onGridReady(event);
 	            }
 	            event.api.sizeColumnsToFit();
 	        },
 	    };

 	    new agGrid.Grid(eGridDiv, gridOptions);
 	    return { gridApi: gridOptions.api, gridOptions };
	}// END OF FUNCTION
	
	// 강제 딜레이 부여
	function debounce(func, wait = 300) {
		    let timeout;
		    return function(...args) {
		        clearTimeout(timeout);
		        timeout = setTimeout(() => func.apply(this, args), wait);
		}
	}
	
	
	/**
 	 * 한국어 flatpickr 공통 초기화 함수
 	 * @param {string} selector - input 요소 선택자 (ex: "#inboundDate")
 	 * @param {Object} options - flatpickr 옵션 추가 가능
 	 */
 	 // date picker 초기화
    function initKoreanDatePicker(selector, options = {}) {
	    flatpickr(selector, {
	        locale: "ko",
	        dateFormat: "Y-m-d",
	        allowInput: true,
	        enableTime: false,
	        onReady: function(selectedDates, dateStr, instance) {
	        	const btnWrapper = document.createElement("div");
	            // 공통 스타일
	            btnWrapper.style.cssText = `
	            	 display: flex;
	                justify-content: space-between; /* 좌우 끝 */
	                width: 100%;                   /* 전체 너비 확보 */
	                padding: 2px 6px;              /* 달력과 버튼 간 여백 */
	                box-sizing: border-box;
	                margin-top: 2px;
	            `;
	
	            // 오늘 버튼
	            const todayBtn = document.createElement("button");
	            todayBtn.type = "button";
	            todayBtn.textContent = "오늘";
	            todayBtn.className = "btn btn-outline-primary btn-sm"; // 테두리 보이게
	            todayBtn.style.cssText = "font-size: 0.65rem; padding: 2px 6px;";
	            todayBtn.addEventListener("click", () => {
	                instance.setDate(new Date());
	                loadFilteredData(); 
	                instance.close();
	            });
	
	            // 초기화 버튼
	            const clearBtn = document.createElement("button");
	            clearBtn.type = "button";
	            clearBtn.textContent = "초기화";
	            clearBtn.className = "btn btn-outline-secondary btn-sm"; // 테두리 보이게
	            clearBtn.style.cssText = "font-size: 0.65rem; padding: 2px 6px;";
	            clearBtn.addEventListener("click", () => {
	                instance.clear();
	                loadOrderListData(); 
	                instance.close();
	            });
	
	            // 버튼 붙이기
	            btnWrapper.appendChild(clearBtn);
	            btnWrapper.appendChild(todayBtn);
	
	            instance.calendarContainer.appendChild(btnWrapper);
	        },
	        ...options
	    });
	}
 	initKoreanDatePicker('#insDate');
	
 	
 	//let gridCreated = false;
 	// withCredentials: true를 추가해야 쿠키 기반 세션을 함께 보내서 로그인 상태를 유지
	document.getElementById("compCode").value = compCode;
	
	// 발주 조회 버튼 클릭시 모달 호출
	searchBtn.addEventListener('click', async () => {
	    const orderListModalEl = document.getElementById('orderListModal');
	    const orderListModal = bootstrap.Modal.getOrCreateInstance(orderListModalEl);
	    orderListModal.show();


	    // Grid 초기화 (한 번만)
	    if (!orderListGridApi) {
	        const eGridDiv = document.getElementById('orderListGrid');
	        const columnDefs = [
	        	{ headerName: "발주코드", field: "orderCode" },
	            { headerName: "거래처코드", field: "cusCode" },
	            { headerName: "거래처명", field: "businessPartner" },
	            { headerName: "담당자", field: "empId" },
	            { headerName: "제품명", field: "productName" },
	            { headerName: "수량", field: "amount" },
	            { headerName: "납기일자", field: "dueDate" },
	            { headerName: "발주계획코드", field: "xpCode" }
	        ];

	        const gridOptions = {
	            columnDefs,
	            rowSelection: "single",
	            pagination: true,
	            paginationPageSize: 10,
	            defaultColDef: {
	                resizable: true,
	                sortable: true,
	                minWidth: 100
	            },
	            onGridReady: async (event) => {
	            	try{
	            		showLoader("gridModalWrapper","데이터를 불러오는 중입니다...");
		                orderListGridApi = event.api;
		                orderListGridApi.sizeColumnsToFit();
		                // showLoader("gridWrapper", "데이터를 불러오는 중입니다...");
		                await loadOrderListData();
	            	}catch(error){
	            		console.error(err);
	                    toastr.error('데이터 로드 실패');
	            	} finally{
	            		hideLoader("gridModalWrapper");
	            	}
	            },
	            onRowDoubleClicked: async (event) => {
	                console.log("선택된 발주 :", event.data);
	                const selectedRow = event.data;
	                // 필요하면 선택한 데이터를 상단 input에 반영
	               	document.getElementById('orderCode').value = selectedRow.orderCode || "";
				    document.getElementById('businessCodeInput').value = selectedRow.cusCode || "";
				    document.getElementById('businessPartnerInput').value = selectedRow.businessPartner || "";
				    document.getElementById('dueDate').value = selectedRow.dueDate || "";
	                await addDetailRow(selectedRow); // 디테일 테이블에 새 row 추가;
	                orderListModal.hide();
	            }
	        };
	        new agGrid.Grid(eGridDiv, gridOptions);
	    } else {
	        orderListGridApi.sizeColumnsToFit();
	        await loadOrderListData();
	    }
	});
	// modal filter
	document.getElementById('keyword').addEventListener("input",debounce(loadFilteredData,500));
	document.getElementById('productName').addEventListener("input",debounce(loadFilteredData,500));
	document.getElementById('insDate').addEventListener("change",debounce(loadFilteredData,500));
	
	async function loadFilteredData() {
		// modal page filter
	    try {
	        showLoader("gridModalWrapper","데이터를 불러오는 중입니다...");
	        const businessPartner = document.getElementById("keyword").value || null;
	        const productName = document.getElementById("productName").value || null;
	        const dueDate = document.getElementById("insDate").value || null;
			
	        const params = {
	        		 companyCode: compCode,
	        		 productName: productName,
	        		 businessPartner: businessPartner,
	        		 dueDate: dueDate
	        }
	        console.log("params:", params); // 👈 params 확인
	        const res = await axios.post("/api/v1/stock/orderList/search", params, {withCredentials: true });
	        orderListGridApi.setRowData(res.data);
	        //inListGrid.gridApi.setRowData(res.data);
	    } catch (err) {
	        console.error(err);
	        toastr.error("조회 실패");
	    } finally {
	        hideLoader("gridModalWrapper");
	    }
	}
	// modal - reset
	document.getElementById("resetModalBtn").addEventListener('click', async ()=>{
		try{
			showLoader("gridModalWrapper","데이터를 불러오는 중입니다...");
			document.getElementById("keyword").value = "";
			document.getElementById("productName").value = "";
			document.getElementById("insDate").value = "";
			await loadOrderListData();
		}catch(err){
			console.log(err);
			toastr.error(err);
		}finally{
			hideLoader("gridModalWrapper");
		}
		
	});
	
	async function addDetailRow(rowData){
		try {
			const orderCode = rowData.orderCode;
	        // rowData.xpCode 기준으로 상세 가져오기
	        const res = await axios.get(`/api/v1/stock/orderDetail/${orderCode}`, { withCredentials: true });
	        const detailData = res.data; // 배열 형태여야 함

	        // AG Grid에 바인딩
	        if (orderDetailGridApi) {
	        	orderDetailGridApi.setRowData(detailData);
	        	orderDetailGridApi.sizeColumnsToFit();
	        } else {
	            const eGridDiv = document.getElementById('inListGrid');
	            const columnDefs = [
	            	  { headerName: "No.", valueGetter: "node.rowIndex + 1", width: 70 },
	                { headerName: "제품코드", field: "productCode" },
	                { headerName: "제품명", field: "productName" },
	                { headerName: "규격", field: "specification" },
	                { headerName: "구매단가", field: "orderPrice", type: 'numericColumn',valueFormatter: p => p.value ? p.value.toLocaleString() : "" },
	                { headerName: "재고수량", field: "stock", type: 'numericColumn' },
	                { headerName: "입고수량", field: "qty",type: 'numericColumn' }
	                
	            ];

	            const gridOptions = {
	                columnDefs,
	                rowData: detailData,
	                rowSelection: "single",
	                pagination: true,
	                paginationPageSize: 10,
	                defaultColDef: { resizable: true, sortable: true, minWidth: 100 },
	                onGridReady: (event) => {
	                	orderDetailGridApi = event.api;
	                	orderDetailGridApi.sizeColumnsToFit();
	                }
	            };
	         	// 그리드 생성 후 API 저장
	            orderDetailGridApi = new agGrid.Grid(eGridDiv, gridOptions).gridOptions.api;
	        }
	    } catch (err) {
	        console.error(err);
	        toastr.error("상세 조회 실패");
	    }
	}

	// 서버에서 발주 계획 데이터 가져오기
	async function loadOrderListData() {
	    try {
	    	showLoader("gridModalWrapper","데이터를 불러오는 중입니다...");
	        const res = await axios.get('/api/v1/stock/orderList', { withCredentials: true });
	        if (orderListGridApi) {
	            orderListGridApi.setRowData(res.data);
	        }
	    } catch (err) {
	        console.error(err);
	        toastr.error('발주 계획 조회 실패');
	    } finally{
	    	hideLoader("gridModalWrapper");
	    }
	}

  	// Axios 등록 + Toast
	submitBtn.addEventListener('click', async (event) => {
		console.log(event.data);
		event.preventDefault(); // 페이지 새로고침 방지
	        // confirm 먼저
	        const res = await cuteAlert({
	        	type: "question",
	            title: "입고 등록",
	            message: "정말 등록하시겠습니까?",
	            imgUrl: 'https://img.icons8.com/?size=100&id=103807&format=png&color=000000',
	            confirmText: "네",
	            cancelText: "아니오"
	        });
	        console.log('cuteAlert result:', res);
	        if(res !== true) {
	            return; // 취소 시 함수 종료
	        }
	        
	        const details = [];
	        if (orderDetailGridApi) {
	            orderDetailGridApi.forEachNode((node) => {
	                details.push({
	 			    businessPartner: document.getElementById('businessPartnerInput').value,
	 			    businessCode: document.getElementById('businessCodeInput').value,
	 			    dueDate: document.getElementById('dueDate').value,
	                productCode: node.data.productCode,
	                productName: node.data.productName,
	                specification: node.data.specification,
	                qty: Number(node.data.qty) || 0,
	                orderPrice: Number(node.data.orderPrice) || 0,
	                note: node.data.note || '',
	                companyCode: Number(document.getElementById('compCode').value) || 0
	                });
	            });
	        }
		  const payload = { details };
		  console.log("JSON.stringify: "+JSON.stringify(payload, null, 2));
		  console.log("payload.orderPrice: "+payload.orderPrice);
		  try {
			  	
			    await axios.post('/api/v1/stock/inboundInsert', payload, {
			      headers: { 'Content-Type': 'application/json' }
			    });
			    
			    //toast.show();
			    toastr.success('등록성공');
			   	form.reset();
			  	if(orderDetailGridApi) orderDetailGridApi.setRowData([]);
			    
        		rowCount = 1; // 행 번호 초기화
			  } catch (err) {
			    //alert('등록 실패: ' + err.message);
			   
				toastr.error('등록 실패: ' + err.message,{timeOut: 3000});
			  }
	});

});
</script>
</th:block>

</body>
</html>
