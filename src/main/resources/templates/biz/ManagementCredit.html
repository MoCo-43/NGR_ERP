<!DOCTYPE html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}"
>
  <head>
    <meta charset="UTF-8" />
    <title layout:fragment="title">거래처 여신 관리</title>

    <th:block layout:fragment="head_extra">
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.1/styles/ag-grid.css"
      />
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.1/styles/ag-theme-quartz.css"
      />
      <style>
      
      /* 로딩 중일 때는 ag-Grid의 "No Rows" 오버레이 숨김 */
	.loader-host.is-loading .ag-overlay-no-rows-center {
	  display: none !important;
	}


      /* ag-Grid 기본 로딩 오버레이도 안 보이게 */
		.loader-host.is-loading .ag-overlay-loading-center {
		  display: none !important;
		}
      
      
      .ag-theme-quartz { height: 100%; width: 100%; }

		/* 공용 로더 */
		.loader-host { position: relative; }
		.loader-overlay {
		  position: absolute; inset: 0;
		  display: none;             /* JS에서 flex로 토글 */
		  align-items: center; justify-content: center;
		  background: rgba(255,255,255,0.55);
		  z-index: 1000;             /* 그리드 위로 확실히 */
		  pointer-events: none;      /* 필요시 auto 로 바꾸면 클릭 차단 */
		}
		.loader-box { display: flex; gap: 8px; align-items: center; }
		
		/* 부모 컨테이너가 실제 높이를 가짐 (여기서 값 조절) */
		.grid-box-520 { height: 520px; }
      
      
        .ag-theme-quartz {
          height: 520px;
          width: 100%;
        }
        .btn-filter-group .btn {
          min-width: 108px;
        }
        .muted {
          color: #6b7280;
          font-size: 12px;
        }
      </style>
    </th:block>
  </head>
  <body>
    <section layout:fragment="content">
      <!-- 상단 탭 -->
      <ul class="nav nav-tabs mb-3" role="tablist">
        <li class="nav-item">
          <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-manage" type="button" role="tab">
            여신현황
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-policy" type="button" role="tab">
            등급정책 관리
          </button>
        </li>
      </ul>

      <!-- 탭 컨테이너 -->
      <div class="tab-content">
        <!-- ① 여신현황 -->
        <div class="tab-pane fade show active" id="tab-manage" role="tabpanel">
          <div class="card shadow mb-3">
            <div class="card-header d-flex align-items-center justify-content-between">
              <h6 class="m-0 font-weight-bold text-primary">거래처 여신 현황</h6>
            </div>
            <div class="card-body">
              <div class="row g-3 align-items-end">
                <div class="col-md-4">
                  <label class="form-label">거래처명</label>
                  <input id="qName" class="form-control" placeholder="상호/거래처명" />
                </div>
                <div class="col-md-4">
                  <label class="form-label">신용등급</label>
                  <select id="qGrade" class="form-control">
                    <option value="" selected>전체</option>
                    <option>A</option>
                    <option>B</option>
                    <option>C</option>
                    <option>D</option>
                    <option>E</option>
                  </select>
                </div>
                <div class="col-md-4 d-flex gap-2">
                  <button id="btnReset" class="btn btn-danger mt-auto">초기화</button>
                  <button id="btnSearch" class="btn btn-dark mt-auto">조회</button>
                </div>
              </div>
            </div>
          </div>

          <div class="card shadow">
            <div class="card-body">
            <!--  그리드 -->
              <!-- 로딩바 구역 -->
<div id="creditGridLoader" class="loader-host grid-box-520" style="width:100%;">
  <div id="gridManage" class="ag-theme-quartz"></div>
  <div class="loader-overlay">
    <div class="loader-box">
      <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
      <span class="ms-2">Loading...</span>
    </div>
  </div>
</div>

      </div>
    </div>
  </div>

        <!-- ② 등급정책 관리 -->
        <div class="tab-pane fade" id="tab-policy" role="tabpanel">
          <div class="card shadow">
            <div class="card-header d-flex align-items-center justify-content-between">
              <h6 class="m-0 font-weight-bold text-primary">등급별 정책</h6>
              <div class="d-flex gap-2">
                <button id="btnPolicyUpdate" class="btn btn-primary btn-sm">정책 변경</button>
              </div>
            </div>
            
            <!--  그리드 -->
            <div class="card-body">
            
<div id="creditGradeGridLoader" class="loader-host grid-box-520">
  <div id="gridPolicy" class="ag-theme-quartz"></div>
  <div class="loader-overlay">
    <div class="loader-box">
      <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
      <span class="ms-2">Loading...</span>
    </div>
  </div>
</div>
            </div>
            
            
          </div>
        </div>
      </div>
    </section>

    <th:block layout:fragment="body_extra">
      <script defer src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.1/dist/ag-grid-community.min.js"></script>
      <script defer src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>

      <script th:inline="none">
        document.addEventListener("DOMContentLoaded", () => {
        	
        	// 조회: DB에서 다시 가져오고(최신화) -> 현재 입력값 기준으로 필터 적용
        	document.getElementById("btnSearch")?.addEventListener("click", async () => {
        	  await fetchManage();              // 내부에서 allManageRows 갱신
        	  // fetchManage 끝나면 _applyFiltersManage()가 호출되도록 이미 구현돼 있으면 이 줄은 불필요
        	  // _applyFiltersManage();          
        	});
        	
          // -------------------- 공용 로더 유틸 --------------------
		function showLoader(containerId) {
		  const c = document.getElementById(containerId);
		  const overlay = c?.querySelector?.('.loader-overlay');
		  if (!c || !overlay) return;
		  c.classList.add('is-loading');          // ← 추가
		  overlay.style.display = 'flex';
		}
		
		function hideLoader(containerId) {
		  const c = document.getElementById(containerId);
		  const overlay = c?.querySelector?.('.loader-overlay');
		  if (!c || !overlay) return;
		  overlay.style.display = 'none';
		  c.classList.remove('is-loading');       // ← 추가
		}

          // -------------------- 상태/헬퍼 --------------------
          const $ = (s) => document.querySelector(s);
          let allManageRows = []; // 여신현황 원본 캐시
          let policyMap = { A: 500000000, B: 100000000, C: 50000000, D: 10000000, E: 0 };

          // -------------------- 그리드 컬럼 --------------------
          const manageCols = [
            { headerName: "거래처코드", field: "cusCode", width: 120, pinned: "left" },
            { headerName: "거래처명", field: "cusName", minWidth: 150, flex: 1 },
            { headerName: "신용등급", field: "creditGrade", width: 100, cellClass: "text-center" },
            { headerName: "여신한도", field: "creditLimit", width: 140, valueFormatter: money },
            { headerName: "적용시작일", field: "startDate", width: 130 },
            { headerName: "적용만료일", field: "expireDate", width: 130 },
            { headerName: "상태", field: "activeStatus", width: 110 },
          ];
          const policyCols = [
            { headerName: "등급", field: "grade", flex: 1, editable: true },
            { headerName: "등급이름", field: "gradeName", flex: 1, editable: true },
            {
              headerName: "최대한도", field: "maxLimit", flex: 1, editable: true,
              valueFormatter: money, valueParser: (p) => Number(String(p.newValue).replaceAll(",", "") || 0),
            },
            { headerName: "할인율(%)", field: "discountRate", flex: 1, editable: true },
          ];

          // -------------------- 그리드 생성 --------------------
          const gridManage = createGrid("#gridManage", manageCols, fetchManage);
          const gridPolicy = createGrid("#gridPolicy", policyCols, fetchPolicy, { rowSelection: 'single' });

          // -------------------- 필터 적용 (프론트 캐시 기반) --------------------
          function _applyFiltersManage() {
            const qName  = (document.getElementById("qName")?.value ?? "").trim().toLowerCase();
            const qGrade = (document.getElementById("qGrade")?.value ?? "").trim();

            const filtered = allManageRows.filter(r => {
              if (qName && String(r.cusName ?? "").toLowerCase().indexOf(qName) === -1) return false;
              if (qGrade && String(r.creditGrade ?? "") !== qGrade) return false;
              return true;
            });

            setRows(gridManage, filtered);
          }

          // -------------------- 이벤트 (검색/초기화) --------------------
		document.getElementById("btnReset")?.addEventListener("click", async () => {
		  document.getElementById("qName").value  = "";
		  document.getElementById("qGrade").value = "";
		  // 방법 A) 캐시 그대로 전체 보여주기 (빠름)
		  setRows(gridManage, allManageRows);
          });
          $("#qName").addEventListener("keydown", (e) => { if (e.key === "Enter") _applyFiltersManage(); });
          $("#qGrade").addEventListener("change", _applyFiltersManage);
          // 타이핑 디바운스
          let _t;
          $("#qName").addEventListener("input", () => {
            clearTimeout(_t);
            _t = setTimeout(_applyFiltersManage, 200);
          });

          // -------------------- 데이터 조회 (현황) --------------------
		async function fetchManage() {
		  try {
		    showLoader('creditGridLoader', "데이터 불러오는 중...");
		    const res = await axios.get("/api/biz/crdlist", { withCredentials: true });
		    const rows = (Array.isArray(res.data) ? res.data : []).map((r) => {
		      // 날짜 포맷 함수
		      const formatDate = (v) => {
		        if (!v) return "";
		        const d = new Date(v);
		        if (isNaN(d)) return v; // 변환 불가하면 원본 반환
		        const y = d.getFullYear();
		        const m = String(d.getMonth() + 1).padStart(2, "0");
		        const day = String(d.getDate()).padStart(2, "0");
		        return `${y}-${m}-${day}`;
		      };
		
		      return {
		        cusCode: r.cusCode,
		        cusName: r.cusName,
		        creditGrade: r.creditGrade,
		        creditLimit: Number(r.creditLimit ?? 0),
		        startDate: formatDate(r.startDate),     // ✅ yyyy-mm-dd 형태로 변환
		        expireDate: formatDate(r.expireDate),   // ✅ 동일 포맷으로 변환
		        activeStatus: r.activeStatus,
		        creditNo: r.creditNo ?? r.id ?? null,
		      };
		    });
		
		    allManageRows = rows;
		    _applyFiltersManage();
		  } catch (e) {
		    console.error(e);
		    allManageRows = [];
		    setRows(gridManage, []);
		  } finally {
		    hideLoader('creditGridLoader');
		  }
		}

          // -------------------- 데이터 조회 (정책) --------------------
          async function fetchPolicy() {
            try {
              showLoader('creditGradeGridLoader', "데이터 불러오는 중...");
              const res = await axios.get("/api/biz/crdgradelist");
              const list = [];

              if (Array.isArray(res.data)) {
                for (const r of res.data) {
                  list.push({
                    grade: r.grade,
                    gradeName: (r.gradeName ?? "").toUpperCase(),
                    maxLimit: Number(r.maxLimit || 0),
                    discountRate: Number(r.discountRate ?? 0),
                  });
                }
              }

              setRows(gridPolicy, list);
              console.log("등급정책 데이터는 =>", res.data);

              // 캐시 갱신
              policyMap = {};
              for (const r of list) {
                policyMap[r.grade] = r.maxLimit;
              }
            } catch (e) {
              console.error(e);
              setRows(gridPolicy, []);
            } finally {
              hideLoader('creditGradeGridLoader');
            }
          }

       // -------------------- 정책 저장/업데이트 --------------------

       // 공통: payload 정규화
       function normalizePolicyRow(d) {
         return {
           grade: (d.grade ?? '').toString().trim().toUpperCase(),
           gradeName: (d.gradeName ?? '').toString().trim(),
           maxLimit: Number(d.maxLimit ?? 0),
           discountRate: Number(d.discountRate ?? 0),
         };
       }

       // 선택 행만 업데이트
       (() => {
         const btn = document.getElementById("btnPolicyUpdate");
         if (!btn) return;

         // 버튼 라벨 변경
         btn.textContent = "선택행 업데이트";

         btn.addEventListener("click", async () => {
           const selected = gridPolicy.api.getSelectedRows?.() || [];
           if (!selected.length) {
             return toastr.warning("업데이트할 행을 하나 선택하세요.");
           }
           if (selected.length > 1) {
             return toastr.warning("하나의 행만 선택하세요.");
           }

           const row = normalizePolicyRow(selected[0]);

           try {
             showLoader('creditGradeGridLoader');
             const res = await cuteAlert({
                 type: "question",
                 title: "정책변경",
                 message: "정책을 업데이트 하시겠습니까?",
                 imgUrl: 'https://img.icons8.com/?size=100&id=103807&format=png&color=000000',
                 confirmText: "네",
                 cancelText: "아니오"
               });
               if (res !== true) return;
             // 단건도 같은 엔드포인트로 1건짜리 배열 전송(백엔드가 리스트 처리)
             await axios.put("/api/biz/crdpolicy", [row]);
             await fetchPolicy();
             toast.success(`등급 ${row.grade} 정책이 업데이트되었습니다.`);
           } catch (e) {
             console.error(e);
             toastr.error("선택행 업데이트 실패");
           } finally {
             hideLoader('creditGradeGridLoader');
           }
         });
       })();

          // -------------------- 공통 유틸 --------------------
          function createGrid(sel, columnDefs, fetchFn, extra = {}) {
            const el = document.querySelector(sel);
            const opts = {
              columnDefs,
              rowData: [],
              pagination: true,
              paginationPageSize: 12,
              defaultColDef: { sortable: true, resizable: true, filter: true },
              onGridReady: (p) => {
                try {
                  p.api && fetchFn?.();
                } catch (err) {
                  console.error('[onGridReady fetch error]', err);
                }
              },
              ...extra,
            };
            let api;
            if (window.agGrid?.createGrid) {
              api = agGrid.createGrid(el, opts);
            } else {
              new agGrid.Grid(el, opts);
              api = opts.api;
            }
            return { el, api, opts };
          }
          function setRows(grid, rows) {
            grid.api?.setGridOption
              ? grid.api.setGridOption("rowData", rows)
              : grid.api.setRowData(rows);
          }
          function money(p) {
            const v = Number(p.value ?? 0);
            return v ? v.toLocaleString("ko-KR") : "0";
          }
        });
      </script>
    </th:block>
  </body>
</html>
