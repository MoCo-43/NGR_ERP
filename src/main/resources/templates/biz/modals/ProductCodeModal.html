<div th:fragment="productcodeModal">
  <div class="modal fade" id="productcodeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">제품코드 선택</h5>
             <button type="button" class="btn btn-light btn-sm border-0" data-bs-dismiss="modal" aria-label="닫기">
            <i class="fas fa-times"></i>
          </button>
        </div>

        <div class="modal-body">
          <div id="productGridLoader" style="position:relative;width:100%;max-height:500px;">
            <div id="productGrid" class="ag-theme-quartz" style="height:400px;width:100%;"></div>

            <!-- 로딩 오버레이 -->
            <div class="loader-overlay"
                 style="display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:rgba(255,255,255,.6);">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button id="PrcImportBtn" type="button" class="btn btn-primary" data-bs-dismiss="modal">가져오기</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
        </div>
      </div>
    </div>
  </div>
</div>
