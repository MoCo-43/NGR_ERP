<!-- templates/fragments/CustomerModal.html -->
<div th:fragment="mngcustomermodal">
  <div
    class="modal fade"
    id="mngcustomermodal"
    tabindex="-1"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <!-- 헤더 -->
        <div class="modal-header">
          <div class="d-flex align-items-center gap-2">
            <!-- 1. 탭: 거래처정보 / 여신 -->
            <div class="btn-group" role="group" aria-label="tabs">
              <button
                type="button"
                class="btn btn-primary btn-sm"
                id="tabInfoBtn"
              >
                거래처정보
              </button>
              <button
                type="button"
                class="btn btn-outline-secondary btn-sm"
                id="tabCreditBtn"
              >
                여신
              </button>
            </div>
          </div>

          <button
            type="button"
            class="btn-close ms-2"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>

        <!-- 바디 -->
        <div class="modal-body">
          <!-- 안내/초기화 -->
          <div class="d-flex justify-content-end mb-2 gap-2">
            <button
              type="button"
              class="btn btn-danger btn-sm"
              id="btnFormReset"
            >
              초기화
            </button>
          </div>

          <!-- 거래처 등록 폼 -->
          <form id="customerForm" class="card p-3">
            <!-- ====== 탭: 거래처정보 ====== -->
            <div id="paneInfo">
              <div class="row g-3">
              <label for="cusCode" id="cusCode" type="hidden"></label>
                <!-- 거래처/판매처 구분-->
                <div class="col-md-6">
                  <label for="gbn" class="form-label">구분</label>
                  <select
                    id="gbn"
                    name="gbn"
                    class="form-control"
                  >
                    <option value="구매처" selected>구매처</option>
                    <option value="판매처">판매처</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label for="bizType" class="form-label">업태</label>
                  <input
                    type="text"
                    id="bizType"
                    name="bizType"
                    class="form-control"
                  />
                </div>

                <!-- 상호 / 종목 -->
                <div class="col-md-6">
                  <label for="cusName" class="form-label">상호</label>
                  <input
                    type="text"
                    id="cusName"
                    name="cusName"
                    class="form-control"
                    required
                  />
                </div>
                <div class="col-md-6">
                  <label for="bizCategory" class="form-label">종목</label>
                  <input
                    type="text"
                    id="bizCategory"
                    name="bizCategory"
                    class="form-control"
                  />
                </div>

                <!-- 사업자번호 / 전화번호 -->
                <div class="col-md-6">
                  <label for="bizNo" class="form-label">사업자번호</label>
                  <input
                    type="text"
                    id="bizNo"
                    name="bizNo"
                    class="form-control"
                    placeholder="000-00-00000"
                  />
                </div>
                <div class="col-md-6">
                  <label for="tel" class="form-label">전화번호</label>
                  <input
                    type="text"
                    id="tel"
                    name="tel"
                    class="form-control"
                    placeholder="010-0000-0000"
                  />
                </div>

                <!-- 대표자명 / Email -->
                <div class="col-md-6">
                  <label for="ceoName" class="form-label">대표자명</label>
                  <input
                    type="text"
                    id="ceoName"
                    name="ceoName"
                    class="form-control"
                  />
                </div>
                <div class="col-md-6">
                  <label for="email" class="form-label">Email</label>
                  <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="name@example.com"
                  />
                </div>

                <!-- 3. 주소(돋보기) / 우편번호 -->
                <div class="col-md-6">
                  <label for="addr" class="form-label">주소</label>
                  <div class="input-group">
                    <input
                      type="text"
                      id="addr"
                      name="addr"
                      class="form-control"
                      placeholder="주소 검색으로 입력"
                    />
                  </div>
                </div>
                <div class="col-md-6">
                  <label for="zipCode" class="form-label">우편번호</label>
                  <input
                    type="text"
                    id="zipCode"
                    name="zipCode"
                    class="form-control"
                    placeholder="우편번호"
                  />
                </div>

                <!-- 4. 담당자(돋보기) -->
                <div class="col-md-6">
                  <label for="empName" class="form-label">담당자</label>
                  <div class="input-group">
                    <input
                      type="text"
                      id="empName"
                      name="empName"
                      class="form-control"
                    />
                  </div>
                </div>

                <!-- 은행 / 은행계좌-->
                <div class="col-md-6">
                  <label for="bankName" class="form-label">은행</label>
                  <input
                    type="text"
                    id="bankName"
                    name="bankName"
                    class="form-control"
                  />
                </div>
                <div class="col-md-6">
                  <label for="bankAccount" class="form-label">은행계좌</label>
                  <input
                    type="text"
                    id="bankAccount"
                    name="bankAccount"
                    class="form-control"
                  />
                </div>

                <!-- 사용여부 -->
                <div class="col-md-6">
                  <label for="activeStatus" class="form-label">사용여부</label>
                  <select
                    id="activeStatus"
                    name="activeStatus"
                    class="form-control"
                  >
                    <option value="Y" selected>Y</option>
                    <option value="N">N</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- ====== 여신 탭 ====== -->
            <div id="paneCredit">
              <div class="row g-3">
                <!-- (2) 여신한도 -->
                <div class="col-md-6">
                  <label for="creditLimit" class="form-label fw-semibold"
                    >여신한도</label
                  >
                  <input
                    type="number"
                    id="creditLimit"
                    class="form-control text-end"
                    placeholder="0"
                  />
                </div>

                <!-- 신용등급 -->
                <div class="col-md-6">
                  <label for="creditGrade" class="form-label">신용등급</label>
                  <select id="creditGrade" class="form-control">
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C" selected>C</option>
                    <option value="D">D</option>
                    <option value="E">E</option>
                  </select>
                </div>

                <!-- 적용시작일 -->
                <div class="col-md-6">
                  <label for="startDate" class="form-label fw-semibold"
                    >적용시작일</label
                  >
                  <div class="input-group">
                    <input type="date" id="startDate" class="form-control" />
                  </div>
                </div>

                <!-- 적용만료일 -->
                <div class="col-md-6">
                  <label for="expireDate" class="form-label fw-semibold"
                    >적용만료일</label
                  >
                  <div class="input-group">
                    <input type="date" id="expireDate" class="form-control" />
                  </div>
                </div>
                <!-- 사용여부 -->
                <div class="col-md-6">
                  <label for="cActiveStatus" class="form-label fw-semibold"
                    >사용여부</label
                  >
                  <select
                    id="cActiveStatus"
                    name="cActiveStatus"
                    class="form-control"
                  >
                    <option value="Y" selected>Y</option>
                    <option value="N">N</option>
                  </select>
                </div>
              </div>
              <!-- 설명 -->
              <div class="col-md-6">
                <div class="form-text">
                  <b>※ 여신만료일에 여신 일괄 결제</b>
                </div>
              </div>
            </div>
          </form>
        </div>

        <!-- 푸터 -->
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            닫기
          </button>

          <div class="ms-auto">
            <button
              type="button"
              class="btn btn-primary"
              id="btnSubmitCustomer"
            >
              등록
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
