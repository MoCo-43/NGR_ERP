<!DOCTYPE html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}"
>
  <head>
    <meta charset="UTF-8" />
    <title layout:fragment="title">출하지시서 조회</title>

    <th:block layout:fragment="head_extra">
      <!-- Bootstrap (base와 버전 충돌 시 강제 주입) -->
      <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        crossorigin="anonymous"
      />
      <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
      />

      <!-- AG Grid -->
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.1/styles/ag-grid.css"
      />
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.1/styles/ag-theme-quartz.css"
      />

      <!-- Toastr -->
      <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.css"
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
      />

      <style>
        .filter-card {
          border: 1px solid #e5e7eb;
        }
        .seg-title {
          font-weight: 700;
          font-size: 0.95rem;
        }
        .status-tabs .btn {
          min-width: 96px;
        }
        .status-tabs .btn.active {
          pointer-events: none;
        }
        .form-inline .form-control {
          min-width: 170px;
        }
        .btn-reset {
          min-width: 92px;
        }
        .ag-theme-quartz {
          height: 520px;
          width: 100%;
        }
        .muted {
          font-size: 12px;
          color: #6b7280;
        }
        #grid.ag-theme-quartz { height: 420px; width: 100%; } /* 원하는 높이로 */
      </style>
    </th:block>
  </head>

  <body>
    <section layout:fragment="content">
      <div class="card shadow mb-4">
        <!-- 헤더 -->
	<div class="card-header py-3 d-flex align-items-center justify-content-between">
          <h6 class="m-0 font-weight-bold text-primary">출하지시서 조회</h6>
     </div>
        
<div class="card-body">
  <!-- 검색 영역 -->
  <div class="form-inline flex-wrap gap-2 align-items-end">
    <label class="form-label mb-2 me-2">작성일자</label>
    <input
      type="date"
      class="form-control"
      id="writeDateStart"
    />

    <label class="form-label mb-2 me-2">납기일자</label>
    <input
      type="date"
      class="form-control"
      id="exDateStart"
    />

    <label class="form-label mb-2 me-2">거래처</label>
    <input
      type="text"
      class="form-control"
      id="customer"
      placeholder="거래처명"
    />

    <button
      type="button"
      class="btn btn-danger"
      id="btnReset"
    >
      초기화
    </button>
    <button
      type="button"
      class="btn btn-primary"
      id="btnSearch"
    >
      조회
    </button>
  </div>
</div>

          <!-- 3) 목록 그리드 -->
    <div class="card-body pt-3">
        <!--  로딩바 구역 -->
        <div id="DoGridLoader" style="position: relative; width: 100%; max-height: 500px;">          
          <div id="grid" class="ag-theme-quartz"></div>
        <!-- 로딩 스피너 -->
          <div id="loaderBsModal" class="loader-overlay" style="display: none;">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>
          </div>
 	</div>
      </div>

      <!-- Toast 알람 -->
      <div class="position-fixed top-0 end-0 p-3" style="z-index: 1080">
        <div
          id="successToast"
          class="toast align-items-center text-bg-success border-0"
          role="alert"
          aria-live="assertive"
          aria-atomic="true"
        >
          <div class="toast-body" id="toastMessage">처리가 완료되었습니다.</div>
        </div>
      </div>
    </section>

    <th:block layout:fragment="body_extra">
      <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.1/dist/ag-grid-community.min.noStyle.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

      <script th:inline="none">
        document.addEventListener("DOMContentLoaded", () => {
          const btnSearch = document.getElementById("btnSearch");
          const btnReset = document.getElementById("btnReset");
          const writeDateStart = document.getElementById("writeDateStart");
          const exDateStart = document.getElementById("exDateStart");
          const customer = document.getElementById("customer");

          // 로더 유틸 (없으면 자동 생성)
          if (typeof window.showLoader !== "function") {
            window.showLoader = (id) => {
              const root = document.getElementById(id);
              const overlay = root?.querySelector?.(".loader-overlay");
              if (overlay) overlay.style.display = "flex";
            };
          }
          if (typeof window.hideLoader !== "function") {
            window.hideLoader = (id) => {
              const root = document.getElementById(id);
              const overlay = root?.querySelector?.(".loader-overlay");
              if (overlay) overlay.style.display = "none";
            };
          }

          // === Grid ===
          const columnDefs = [
            { headerName: "지시서번호", field: "orderCode", width: 120 },
            {
              headerName: "작성일자",
              field: "insertDate",
              width: 120,
              valueFormatter: (p) =>
                p.value
                  ? new Date(p.value).toLocaleDateString("ko-KR")
                  : "",
            },
            { headerName: "거래처명", field: "customerName", minWidth: 140 },
            { headerName: "품목명", field: "productName", minWidth: 180 },
            { headerName: "주소", field: "addr", flex: 1 },
            {
              headerName: "납기일자",
              field: "exDate",
              width: 120,
              valueFormatter: (p) =>
                p.value
                  ? new Date(p.value).toLocaleDateString("ko-KR")
                  : "",
            },
            { headerName: "진행상태", field: "status", width: 110 },
          ];

          const gridOptions = {
            columnDefs,
            rowData: [],
            rowSelection: "single",
            animateRows: true,
            defaultColDef: { sortable: true, resizable: true },
          };

          new agGrid.Grid(document.getElementById("grid"), gridOptions);

          // === 조회 함수 ===
          async function fetchList() {
            const params = {
              writeDateStart: writeDateStart.value || "",
              exDateStart: exDateStart.value || "",
              customer: customer.value.trim() || "",
            };

            try {
              showLoader("DoGridLoader");
              const res = await axios.get("/api/biz/dolist", {
                params,
                timeout: 15000,
              });

              let rows = Array.isArray(res.data) ? res.data : [];

              // --- 클라이언트 필터 폴백 ---
              if (params.writeDateStart) {
                const ws = new Date(params.writeDateStart).setHours(0, 0, 0, 0);
                rows = rows.filter(
                  (d) =>
                    d.doCreated &&
                    new Date(d.doCreated).setHours(0, 0, 0, 0) >= ws
                );
              }
              if (params.exDateStart) {
                const es = new Date(params.exDateStart).setHours(0, 0, 0, 0);
                rows = rows.filter(
                  (d) =>
                    d.exDate &&
                    new Date(d.exDate).setHours(0, 0, 0, 0) >= es
                );
              }
              if (params.customer) {
                const kw = params.customer.toLowerCase();
                rows = rows.filter((d) =>
                  String(d.cusName || "")
                    .toLowerCase()
                    .includes(kw)
                );
              }

              const mapped = rows.map((d) => ({
                orderCode: d.doCode,
                insertDate: d.doCreated,
                customerName: d.cusName,
                productName: d.productName,
                addr: d.addr,
                exDate: d.exDate,
                status: d.doStatus,
              }));

              gridOptions.api.setRowData(mapped);
              gridOptions.api.sizeColumnsToFit();
            } catch (e) {
              console.error(e);
              toastr.error("목록 조회 실패");
            } finally {
              hideLoader("DoGridLoader");
            }
          }

          // === 이벤트 바인딩 ===
          btnSearch.addEventListener("click", fetchList);
          [writeDateStart, exDateStart, customer].forEach((el) => {
            el.addEventListener("keydown", (e) => {
              if (e.key === "Enter") {
                e.preventDefault();
                fetchList();
              }
            });
          });

          btnReset.addEventListener("click", () => {
            writeDateStart.value = "";
            exDateStart.value = "";
            customer.value = "";
            fetchList();
          });

          // 초기 로드
          fetchList();
        });
      </script>
    </th:block>
  </body>
</html>
