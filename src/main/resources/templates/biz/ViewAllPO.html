<!DOCTYPE html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}"
>
  <head>
    <title layout:fragment="title">주문서 조회</title>

    <th:block layout:fragment="head_extra">
      <!-- AG Grid CSS -->
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.1/styles/ag-grid.css"
      />
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.1/styles/ag-theme-quartz.css"
      />

      <style>
        /* 그리드 영역 */
        #orderGrid.ag-theme-quartz {
          height: 560px;
          width: 100%;
        }

        /* 디자인 보정 */
        .btn-filter-group .btn {
          min-width: 108px;
        }
        .form-inline .form-control {
          min-width: 180px;
        }
        .muted {
          color: #6b7280;
          font-size: 12px;
        }
        .text-right {
          text-align: right;
        }
      </style>
    </th:block>
  </head>

  <body>
    <section layout:fragment="content">
      <!--검색/필터 카드 -->
      <div class="card shadow mb-4">
        <div
          class="card-header py-3 d-flex align-items-center justify-content-between"
        >
          <h6 class="m-0 font-weight-bold text-primary">주문서 조회</h6>
        </div>

        <div class="card-body">
          <!-- 2~6. 검색 조건 -->
          <div class="form-inline flex-wrap gap-2">
            <label class="mr-2 mb-2">작성일자</label>
            <input id="date" type="date" class="form-control mr-3 mb-2" />

            <label class="mr-2 mb-2">거래처</label>
            <input
              id="customer"
              type="text"
              class="form-control mr-3 mb-2"
              placeholder="거래처 검색"
            />

            <label class="mr-2 mb-2">제품명</label>
            <input
              id="productName"
              type="text"
              class="form-control mr-3 mb-2"
            />

            <button id="btnSearch" class="btn btn-dark mb-2">조회</button>
          </div>
        </div>
      <!-- *************** 주문서 리스트(ag-Grid) *************** -->
      <!--  승인 및 입금완료 버튼 -->
        <div class="card-header py-3">
          <button id="btnPoConfirm" class="btn btn-dark mb-2">승인</button>
          <button id="btnPaymentConfirm" class="btn btn-dark mb-2">
            입금완료
          </button>
        </div>
        <!--  로딩바 구역 -->
        <div id="orderGridLoader" style="position: relative; width: 100%; max-height: 500px;">
          <div id="orderGrid" class="ag-theme-quartz"></div>
         <!-- 로딩 스피너 -->
          <div id="loaderBsModal" class="loader-overlay" style="display: none;">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>
         </div>
      </div>

      <!-- 거래처 모달 -->
      <div th:replace="~{biz/modals/PoCustomerModal :: customermodal}"></div>
    </section>

    <th:block layout:fragment="body_extra">
      <!-- libs -->
      <script
        defer
        src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.1/dist/ag-grid-community.min.js"
      ></script>
      <script
        defer
        src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"
      ></script>

      <script th:inline="none">
        // gripApi 전역설정
        let gridApi;
        document.addEventListener("DOMContentLoaded", () => {
          // ===== ag-Grid 컬럼 (설계안 그대로) =====
          const columnDefs = [
            {
              headerName: "",
              width: 70,
              checkboxSelection: true,
              headerCheckboxSelection: true,
              filter: false,
              suppressMenu: true,
              pinned: "left",
            },
            { headerName: "주문번호", field: "poCode", flex : 1 },
            {
              headerName: "작성일자",
              field: "poStart",
              width: 140,
              valueFormatter: (p) =>
                p.value ? new Date(p.value).toLocaleDateString("ko-KR") : "",
            },
            { headerName: "거래처명", field: "cusName", width: 140 },
            { headerName: "담당자", field: "creater", width: 110 },
            {
              headerName: "제품명",
              field: "productName",
              flex: 1,
              minWidth: 220,
            },
            {
              headerName: "납기일자",
              field: "exDate",
              width: 140,
              valueFormatter: (p) =>
                p.value ? new Date(p.value).toLocaleDateString("ko-KR") : "",
            },
            {
              headerName: "주문금액",
              field: "supAmt",
              width: 140,
              type: "rightAligned",
              valueFormatter: (p) =>
                p.value || p.value === 0
                  ? Number(p.value).toLocaleString("ko-KR")
                  : "",
            },
            { headerName: "진행상태", field: "poStatus", width: 120 },
          ];

          // ===== Grid 옵션 =====
          const gridDiv = document.getElementById("orderGrid");

          const gridOptions = {
            columnDefs,
            rowData: [],
            rowSelection: "multiple",
            rowMultiSelectWithClick: true,
            pagination: true,
            paginationPageSize: 12,
            animateRows: true,
            defaultColDef: { sortable: true, resizable: true, filter: true },
            onGridReady: (p) => {
              gridApi = p.api;
              search(); // 최초 로드
            },
            onModelUpdated: updatePinnedTotals,
            onFilterChanged: updatePinnedTotals,
            onSortChanged: updatePinnedTotals,
          };

          if (window.agGrid?.createGrid)
            gridApi = agGrid.createGrid(gridDiv, gridOptions);
          else {
            new agGrid.Grid(gridDiv, gridOptions);
            gridApi = gridOptions.api;
          }

          const setRows = (rows) =>
            gridApi?.setGridOption
              ? gridApi.setGridOption("rowData", rows)
              : gridApi.setRowData(rows);
          const setPinnedBottom = (rows) =>
            gridApi?.setGridOption
              ? gridApi.setGridOption("pinnedBottomRowData", rows)
              : gridApi.setPinnedBottomRowData(rows);

          // ===== 합계(핀드 바텀) =====
          function updatePinnedTotals() {
            if (!gridApi) return;
            let sum = 0,
              count = 0;
            gridApi.forEachNodeAfterFilterAndSort((n) => {
              count++;
              const v = Number(n.data?.supAmt || 0);
              if (!Number.isNaN(v)) sum += v;
            });
            setPinnedBottom([
              { cusName: `건수 ${count}건`, productName: "합계", supAmt: sum },
            ]);
          }

          // ===== API 호출 =====
          // 그리드 showLoader 적용 
          async function search(override = {}) {
            try {
            	showLoader('orderGridLoader',"데이터를 불러오는 중입니다...");
              const { data } = await axios.get("/api/biz/polist", {
                params: override,
              });

              const rows = (Array.isArray(data) ? data : []).map((r) => ({
                poCode: r.poCode,
                poStart: r.poStart,
                cusName: r.cusName,
                creater: r.creater,
                productName: r.productName,
                exDate: r.exDate,
                supAmt: r.supAmt,
                poStatus: r.poStatus,
              }));

              console.log("EX_DATE 결과는 => :", rows);
              setRows(rows);
              updatePinnedTotals();
            } catch (err) {
              console.error(err);
              setRows([]);
              setPinnedBottom([{ productName: "에러", supAmt: 0 }]);
            } finally{
            	hideLoader('orderGridLoader');
            }
          }

          // ===== 이벤트 연결 =====
          document
            .querySelectorAll(".btn-filter-group [data-status]")
            .forEach((btn) => {
              btn.addEventListener("click", () => {
                const status = btn.getAttribute("data-status") || "";
                // 상태 셀렉트도 동기화
                const sel = document.getElementById("status");
                if (sel) sel.value = status;
                search({ status });
              });
            });
          document
            .getElementById("btnSearch")
            ?.addEventListener("click", () => search());
          // Enter로 검색
          ["customer", "productCode"].forEach((id) => {
            const el = document.getElementById(id);
            el?.addEventListener("keydown", (e) => {
              if (e.key === "Enter") search();
            });
          });
        });
        /*

          ======================== 거래처 모달 ========================


        */
        document.addEventListener("DOMContentLoaded", () => {
          const customerCodeModalEl = document.getElementById("customermodal");
          let customerCodeGridApi;
          const customerCodeColumnDefs = [
            { headerName: "", checkboxSelection: true, width: 50 },
            { headerName: "거래처코드", field: "cusCode", width: 140 },
            {
              headerName: "거래처명",
              field: "cusName",
              flex: 1,
              minWidth: 160,
            },
            { headerName: "신용등급", field: "creditGrade", width: 140 },
            { headerName: "미수금", field: "leftPrice", width: 140 },
          ];
          async function fetchCustomerCodeData() {
            if (!customerCodeGridApi) return;
            try {
              const { data } = await axios.get("/api/biz/customercode");
              customerCodeGridApi.setRowData(data || []);
              customerCodeGridApi.sizeColumnsToFit?.();
            } catch (err) {
              console.error("거래처조회 실패:", err);
              alert("거래처 불러오는 데 실패했습니다.");
            }
          }
          if (customerCodeModalEl) {
            customerCodeModalEl.addEventListener("shown.bs.modal", () => {
              const gridDiv = document.getElementById("customerGrid");
              if (!customerCodeGridApi) {
                if (window.agGrid?.createGrid) {
                  customerCodeGridApi = agGrid.createGrid(
                    gridDiv,
                    customerCodeGridOptions
                  );
                } else {
                  customerCodeGridApi = customerCodeGridOptions.api;
                }
              }
              fetchCustomerCodeData();
            });
          }
          const customerCodeGridOptions = {
            columnDefs: customerCodeColumnDefs,
            rowSelection: "single",
            rowData: [],
            defaultColDef: { sortable: true, resizable: true, filter: true },
            onGridReady: (p) => {
              customerCodeGridApi = p.api;
            },
          };

          // 1) 거래처 선택 시 코드/이름 모두 세팅
          function assignCustomerToForm(row) {
            const cusNameEl = document.getElementById("cusName");
            const cusCodeEl = document.getElementById("cusCode");
            if (cusNameEl) cusNameEl.value = row.cusName ?? "";
            if (cusCodeEl) cusCodeEl.value = row.cusCode ?? "";
          }

          // 거래처 모달의 선택 버튼 클릭 이벤트
          const importCustomerCodeBtn = document.getElementById("CstImportBtn");
          if (importCustomerCodeBtn) {
            importCustomerCodeBtn.addEventListener("click", () => {
              if (!customerCodeGridApi) return alert("목록을 먼저 불러오세요.");
              const selected = customerCodeGridApi.getSelectedRows?.() || [];
              if (!selected.length) return alert("거래처를 선택하세요.");

              assignCustomerToForm(selected[0]);

              const modal = bootstrap.Modal.getInstance(customerCodeModalEl);
              modal?.hide();
            });
          } else {
            console.warn(
              "가져오기 버튼(#CstImportBtn)을 modal HTML에 추가해주세요."
            );
          }
        });

        // 승인, 입금완료 버튼 처리
        // === 공통 유틸 ===
        // 선택된 poCode 배열
        function getSelectedPoCodes() {
          if (!gridApi) return [];
          const sel = gridApi.getSelectedRows?.() || [];
          return sel.map((r) => r.poCode);
        }
        // 버튼 로딩/해제
        function setBusy(btn, busy, busyLabel) {
          if (!btn) return;
          btn.disabled = !!busy;
          if (busy) {
            btn.dataset.idleLabel ??= btn.textContent;
            btn.textContent =
              busyLabel || btn.dataset.busyLabel || btn.textContent;
          } else {
            btn.textContent = btn.dataset.idleLabel || btn.textContent;
          }
        }
        // 단건 업데이트 호출 (Mapper 단건)
        async function putPoStatusSingle(poCodes, poStatus) {
          return await axios.put("/api/biz/postatus", { poCodes, poStatus });
        }

        // ================= 승인 버튼 처리 =================
        document.addEventListener("DOMContentLoaded", () => {
          const btnConfirm = document.getElementById("btnPoConfirm");

          btnConfirm?.addEventListener("click", async () => {
            if (!gridApi) return alert("그리드 준비 전입니다.");
            const poCodes = getSelectedPoCodes();
            if (!poCodes.length) return alert("승인할 주문서를 선택하세요.");

            // (선택) 현재상태 가드: 승인대기만 승인
            const selected = gridApi.getSelectedRows?.() || [];
            const invalid = selected.filter(
              (r) => r.poStatus && r.poStatus !== "승인대기"
            );
            if (
              invalid.length &&
              !confirm(
                `'승인대기'가 아닌 ${invalid.length}건 포함. 그래도 진행할까요?`
              )
            )
              return;

            if (
              !confirm(`선택된 ${poCodes.length}건을 '작성완료'로 변경할까요?`)
            )
              return;

            setBusy(btnConfirm, true, "승인 처리중...");
            try {
              const results = await putPoStatusSingle(poCodes, "작성완료");
              alert(`${results}건 처리완료`);
              // 재조회 (search 함수가 이미 위에 정의되어 있음)
              if (typeof search === "function") await search();
            } catch (e) {
              console.error(e);
              alert("승인 처리 중 오류가 발생했습니다.");
            } finally {
              setBusy(btnConfirm, false);
            }
          });
        });

        // ================= 입금완료 버튼 처리 =================
        document.addEventListener("DOMContentLoaded", () => {
          const btnConfirm = document.getElementById("btnPaymentConfirm");

          btnConfirm?.addEventListener("click", async () => {
            if (!gridApi) return alert("그리드 준비 전입니다.");
            const poCodes = getSelectedPoCodes();
            if (!poCodes.length)
              return alert("입금완료 처리할 주문서를 선택하세요.");

            // (선택) 현재상태 가드: 출하완료만 입금완료
            const selected = gridApi.getSelectedRows?.() || [];
            const invalid = selected.filter(
              (r) => r.poStatus && r.poStatus !== "출하완료"
            );

            if (invalid.length) {
              alert(
                `'출하완료'가 아닌 ${invalid.length}건 포함. 진행할수 없습니다.`
              );
              return;
            }

            if (
              !confirm(`선택된 ${poCodes.length}건을 '입금완료'로 변경할까요?`)
            )
              return;

            setBusy(btnConfirm, true, "처리중...");
            try {
              const results = await putPoStatusSingle(poCodes, "입금완료");
              alert(`${results}건 처리완료`);

              if (typeof search === "function") await search();
            } catch (e) {
              console.error(e);
              alert("입금완료 처리 중 오류가 발생했습니다.");
            } finally {
              setBusy(btnConfirm, false);
            }
          });
        });
      </script>
    </th:block>
  </body>
</html>
