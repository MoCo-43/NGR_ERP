<!DOCTYPE html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}"
>
  <head>
    <title layout:fragment="title">주문서 조회</title>

    <th:block layout:fragment="head_extra">
      <!-- AG Grid CSS -->
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.1/styles/ag-grid.css"
      />
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.1/styles/ag-theme-quartz.css"
      />

      <style>
        /* 그리드 영역 */
        #orderGrid.ag-theme-quartz {
          height: 560px;
          width: 100%;
        }

        /* 디자인 보정 */
        .btn-filter-group .btn {
          min-width: 108px;
        }
        .form-inline .form-control {
          min-width: 180px;
        }
        .muted {
          color: #6b7280;
          font-size: 12px;
        }
        .text-right {
          text-align: right;
        }
      </style>
    </th:block>
  </head>

  <body>
    <section layout:fragment="content">
      <!--검색/필터 카드 -->
      <div class="card shadow mb-4">
        <div class="card-header py-3 d-flex align-items-center justify-content-between">
          <h6 class="m-0 font-weight-bold text-primary">주문서 조회</h6>
        </div>

        <div class="card-body pt-3">
          <!-- 2~6. 검색 조건 -->
          <div class="form-inline flex-wrap gap-2">
            <label class="mr-2 mb-2">작성일자</label>
            <input id="date" type="date" class="form-control mr-2 mb-2" />

            <label class="mr-2 mb-2">거래처</label>
            <input
              id="customer"
              type="text"
              class="form-control mr-2 mb-2"
              placeholder="거래처 검색"
            />

            <label class="mr-2 mb-2">제품명</label>
            <input
              id="productName"
              type="text"
              class="form-control mr-2 mb-2"/>
	<div class="d-flex justify-content-end gap-2 pb-0">
		  <!--  검색 조회 초기화 버튼 -->
            <button id="btnSearch" class="btn btn-dark mr-2">조회</button>
            <button id="btnReset" class="btn btn-danger mr-2"> 초기화</button>
	      <!--  승인 및 입금완료 버튼 -->
	  <button id="btnPoConfirm" class="btn btn-primary mr-2">승인</button>
	  <button id="btnPaymentConfirm" class="btn btn-success mr-2">입금완료</button>
	</div>
          </div>
        </div>
      <!-- *************** 주문서 리스트(ag-Grid) *************** -->

        <!--  로딩바 구역 -->
        <div id="orderGridLoader" style="position: relative; width: 100%; max-height: 500px;">
          <div id="orderGrid" class="ag-theme-quartz"></div>
         <!-- 로딩 스피너 -->
          <div id="loaderBsModal" class="loader-overlay" style="display: none;">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>

         </div>
      </div>
    </section>

    <th:block layout:fragment="body_extra">
      <!-- libs -->
      <script
        defer
        src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.1/dist/ag-grid-community.min.js"
      ></script>
      <script
        defer
        src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"
      ></script>

      <script th:inline="none">
        // gripApi 전역설정
        let gridApi;
        
     // 검색필터 전역 추가
        let allRows = [];        // 서버에서 가져온 전체 데이터(원본)
        let currentStatus = "";  // 상태 버튼으로 선택된 상태 저장 (없으면 빈 문자열)
     
        
     // 검색필터 헬퍼
        const byId  = (id) => document.getElementById(id);
        const getVal= (id) => byId(id)?.value?.trim() ?? "";
        const norm  = (s) => String(s ?? "").toLowerCase();
        
     // 검색필터 날짜 같은 날인지 비교 (YYYY-MM-DD만 비교)
        function isSameDay(dateStr, ymdStr) {
          if (!dateStr || !ymdStr) return true;             // 필터 미입력이면 통과
          const d = new Date(dateStr);
          const y = d.getFullYear(), m = (d.getMonth()+1+'').padStart(2,'0'), day=(d.getDate()+'').padStart(2,'0');
          return `${y}-${m}-${day}` === ymdStr;
        }

        // 검색필터 그리드에 행 세팅(네가 쓰던 setRows 래핑)
        function setGridRows(rows){
          if (gridApi?.setGridOption) gridApi.setGridOption("rowData", rows);
          else gridApi?.setRowData?.(rows);
        }
        
        
        
        
        
     // ===== 공통 함수: 상태 변경 API 호출 =====
        async function putPoStatusSingle(poCodes, poStatus) {
          console.log('[PUT] /api/biz/postatus', {poCodes, poStatus});
          const { data } = await axios.put('/api/biz/postatus', 
            { poCodes, poStatus }, 
            { withCredentials: true }
          );
          console.log('[RESULT] /api/biz/postatus', data);
          return data; // 변경건수(int)
        }

        // ===== 공통 함수: 입금완료 API 호출 =====
        async function putPaymentComplete(poCodes, poStatus) {
          console.log('[PUT] /api/biz/compostatus', {poCodes, poStatus});
          const { data } = await axios.put('/api/biz/compostatus', 
            { poCodes, poStatus }, 
            { withCredentials: true }
          );
          console.log('[RESULT] /api/biz/compostatus', data);
          return data;
        }

        // ===== 선택된 주문서 가져오기 =====
        function getSelectedPoCodes() {
          if (!gridApi) return [];
          const sel = gridApi.getSelectedRows?.() || [];
          return sel.map((r) => r.poCode);
        }

        // ===== 버튼 로딩 상태 변경 =====
        function setBusy(btn, busy, busyLabel) {
          if (!btn) return;
          btn.disabled = !!busy;
          if (busy) {
            btn.dataset.idleLabel ??= btn.textContent;
            btn.textContent = busyLabel || btn.dataset.busyLabel || btn.textContent;
          } else {
            btn.textContent = btn.dataset.idleLabel || btn.textContent;
          }
        }
        
        
        
        
        
        document.addEventListener("DOMContentLoaded", () => {
          // ===== ag-Grid 컬럼 (설계안 그대로) =====
          const columnDefs = [
            {
              headerName: "",
              width: 70,
              checkboxSelection: true,
              headerCheckboxSelection: true,
              filter: false,
              suppressMenu: true,
              pinned: "left",
            },
            { headerName: "주문번호", field: "poCode", flex : 1 },
            {
              headerName: "작성일자",
              field: "poStart",
              width: 140,
              valueFormatter: (p) =>
                p.value ? new Date(p.value).toLocaleDateString("ko-KR") : "",
            },
            { headerName: "거래처명", field: "cusName", width: 140 },
            { headerName: "담당자", field: "empName", width: 110 },
            {
              headerName: "제품명",
              field: "productName",
              flex: 1,
              minWidth: 220,
            },
            {
              headerName: "납기일자",
              field: "exDate",
              width: 140,
              valueFormatter: (p) =>
                p.value ? new Date(p.value).toLocaleDateString("ko-KR") : "",
            },
            {
              headerName: "주문금액",
              field: "supAmt",
              width: 140,
              type: "rightAligned",
              valueFormatter: (p) =>
                p.value || p.value === 0
                  ? Number(p.value).toLocaleString("ko-KR")
                  : "",
            },
            { headerName: "진행상태", field: "poStatus", width: 120 },
          ];

          // ===== Grid 옵션 =====
          const gridDiv = document.getElementById("orderGrid");

          const gridOptions = {
            columnDefs,
            rowData: [],
            rowSelection: "multiple",
            rowMultiSelectWithClick: true,
            pagination: true,
            paginationPageSize: 12,
            animateRows: true,
            defaultColDef: { sortable: true, resizable: true, filter: true },
            onGridReady: (p) => {
              gridApi = p.api;
              search(); // 최초 로드
            },
            onModelUpdated: updatePinnedTotals,
            onFilterChanged: updatePinnedTotals,
            onSortChanged: updatePinnedTotals,
          };

          if (window.agGrid?.createGrid)
            gridApi = agGrid.createGrid(gridDiv, gridOptions);
          else {
            new agGrid.Grid(gridDiv, gridOptions);
            gridApi = gridOptions.api;
          }

          const setRows = (rows) =>
            gridApi?.setGridOption
              ? gridApi.setGridOption("rowData", rows)
              : gridApi.setRowData(rows);
          const setPinnedBottom = (rows) =>
            gridApi?.setGridOption
              ? gridApi.setGridOption("pinnedBottomRowData", rows)
              : gridApi.setPinnedBottomRowData(rows);

          // ===== 합계(핀드 바텀) =====
          function updatePinnedTotals() {
            if (!gridApi) return;
            let sum = 0,
              count = 0;
            gridApi.forEachNodeAfterFilterAndSort((n) => {
              count++;
              const v = Number(n.data?.supAmt || 0);
              if (!Number.isNaN(v)) sum += v;
            });
            setPinnedBottom([
              { cusName: `건수 ${count}건`, productName: "합계", supAmt: sum },
            ]);
          }

          // ===== API 호출 =====
          // 그리드 showLoader 적용 
          async function search(override = {}) {
       	  try {
       		    showLoader('orderGridLoader',"데이터 불러오는 중...");
       		    const { data } = await axios.get("/api/biz/polist", { params: {} }); // 전체
       		    allRows = (Array.isArray(data) ? data : []).map(r => ({
       		      poCode: r.poCode,
       		      poStart: r.poStart,
       		      cusName: r.cusName,
       		      empName: r.empName,
       		      productName: r.productName,
       		      exDate: r.exDate,
       		      supAmt: r.supAmt,
       		      poStatus: r.poStatus,
       		      payMethod: r.payMethod,
       		    }));
       		    applyFilters(); // 최초 표시
       		  } catch (err) {
       		    console.error(err);
       		    allRows = [];
       		    setGridRows([]);
       		  } finally {
       		    hideLoader('orderGridLoader');
       		  }
       		}

       // ==== 2) 프론트 필터링 본체 ====
          function applyFilters() {
            const dateYMD     = getVal("date");        // YYYY-MM-DD
            const customerQ   = norm(getVal("customer"));
            const productQ    = norm(getVal("productName"));
            const statusQ     = (byId("status")?.value ?? currentStatus ?? "").trim(); // select or 버튼

            // 원본에서 필터
            const filtered = allRows.filter(r => {
              // 날짜(작성일자 기준)
              if (!isSameDay(r.poStart, dateYMD)) return false;

              // 거래처명 부분검색
              if (customerQ && !norm(r.cusName).includes(customerQ)) return false;

              // 제품명 부분검색(대표 제품명 문자열에 대해)
              if (productQ && !norm(r.productName).includes(productQ)) return false;

              // 상태 일치 (공백이면 패스)
              if (statusQ && String(r.poStatus ?? "") !== statusQ) return false;

              return true;
            });

            setGridRows(filtered);

            // 합계/핀드 바텀 갱신(네 함수 그대로 호출)
            if (typeof updatePinnedTotals === "function") updatePinnedTotals();
          }
        
        
       // 조회 버튼 → 프론트 필터
          byId("btnSearch")?.addEventListener("click", () => applyFilters());

          // 초기화 버튼 → 값 비우고 필터
          byId("btnReset")?.addEventListener("click", () => {
            ["date","customer","productName"].forEach(id => { if (byId(id)) byId(id).value = ""; });
            if (byId("status")) byId("status").value = "";
            currentStatus = "";
            applyFilters();
          });

          // 엔터 검색
          ["customer","productName"].forEach(id => {
            byId(id)?.addEventListener("keydown", (e) => { if (e.key === "Enter") applyFilters(); });
          });

          // 상태 버튼 그룹 → currentStatus 세팅 후 필터
          document.querySelectorAll(".btn-filter-group [data-status]")?.forEach(btn => {
            btn.addEventListener("click", () => {
              currentStatus = btn.getAttribute("data-status") || "";
              if (byId("status")) byId("status").value = currentStatus; // select와 동기화
              applyFilters();
            });
          });
          
          
       

       // ===============================================
       // 🟢 1. 승인 버튼 처리 (엄격한 검증 + 이미 처리된 건 안내)
       // ===============================================
       const btnPoConfirm = document.getElementById("btnPoConfirm");

       btnPoConfirm?.addEventListener("click", async () => {
         try {
           if (!gridApi) {
             console.warn('gridApi가 아직 없습니다.');
             return toastr.info("그리드 준비 전입니다.");
           }

           const selected = gridApi.getSelectedRows?.() || [];
           const poCodes = selected.map(r => r.poCode);
           
           console.log('[승인 클릭] 선택건수:', poCodes.length, poCodes);

           if (!poCodes.length) {
             return toastr.warning("승인할 주문서를 선택하세요.");
           }

           // 📊 상태별 분류
           const alreadyCompleted = selected.filter(r => r.poStatus === "작성완료"); // 이미 처리됨
           const canProcess = selected.filter(r => r.poStatus === "승인대기"); // 처리 가능
           const invalid = selected.filter(r => r.poStatus !== "승인대기" && r.poStatus !== "작성완료"); // 불가능

           console.log('이미 작성완료:', alreadyCompleted.length);
           console.log('승인대기:', canProcess.length);
           console.log('처리 불가:', invalid.length);

           // ✅ 이미 모두 작성완료인 경우
           if (alreadyCompleted.length === selected.length) {
             toastr.info(`선택된 ${selected.length}건이 이미 '작성완료' 상태입니다.`);
             return;
           }

           // ❌ 승인대기도 작성완료도 아닌 건이 있으면 에러
           if (invalid.length > 0) {
             console.error('[승인 불가] 처리할 수 없는 상태:', invalid);
             toastr.error(`'승인대기' 상태만 승인할 수 있습니다.\n선택된 건 중 ${invalid.length}건은 처리할 수 없습니다.`);
             return;
           }

           // 🔔 일부는 이미 작성완료, 일부는 승인대기인 경우
           if (alreadyCompleted.length > 0 && canProcess.length > 0) {
             const res = await cuteAlert({
               type: "question",
               title: "주문 확인",
               message: `${alreadyCompleted.length}건은 이미 '작성완료' 상태입니다.<br>${canProcess.length}건만 승인 처리하시겠습니까?`,
               imgUrl: "https://img.icons8.com/?size=100&id=103807&format=png&color=000000",
               confirmText: "네",
               cancelText: "아니오",
             });
             
             if (!(res === true || res === "confirm")) return;

             // 승인대기 건만 처리
             const processPoCodes = canProcess.map(r => r.poCode);
             setBusy(btnPoConfirm, true, "승인 처리중...");
             const results = await putPoStatusSingle(processPoCodes, "작성완료");
             
             toastr.success(`${results}건 처리완료 (${alreadyCompleted.length}건은 이미 처리됨)`);
             if (typeof search === "function") await search();
             return;
           }

           // ✅ 모든 선택 건이 승인대기 상태일 때만 최종 확인
           const res = await cuteAlert({
             type: "question",
             title: "주문 확인",
             message: `선택된 ${poCodes.length}건을 '작성완료'로 변경할까요?`,
             imgUrl: "https://img.icons8.com/?size=100&id=103807&format=png&color=000000",
             confirmText: "네",
             cancelText: "아니오",
           });
           
           if (!(res === true || res === "confirm")) return;

           // API 호출
           setBusy(btnPoConfirm, true, "승인 처리중...");
           const results = await putPoStatusSingle(poCodes, "작성완료");
           
           toastr.success(`${results}건 처리완료`);
           
           // 그리드 새로고침
           if (typeof search === "function") await search();
           
         } catch (e) {
           console.error('[승인 에러]', e);
           toastr.error("승인 처리 중 오류가 발생했습니다.");
         } finally {
           setBusy(btnPoConfirm, false);
         }
       });

       // ===============================================
       // 🟢 2. 입금완료 버튼 처리 (엄격한 검증 + 이미 처리된 건 안내)
       // ===============================================
       const btnPaymentConfirm = document.getElementById("btnPaymentConfirm");

       btnPaymentConfirm?.addEventListener("click", async () => {
         try {
           if (!gridApi) {
             console.warn('gridApi가 아직 없습니다.');
             return toastr.info("그리드 준비 전입니다.");
           }

           const selected = gridApi.getSelectedRows?.() || [];
           const poCodes = selected.map(r => r.poCode);
           
           console.log('[입금완료 클릭] 선택건수:', poCodes.length, poCodes);

           if (!poCodes.length) {
             return toastr.warning("입금확인할 주문서를 선택하세요.");
           }

           // 📊 상태별 분류
           const alreadyPaid = selected.filter(r => r.poStatus === "입금완료"); // 이미 처리됨
           const canProcess = selected.filter(r => r.poStatus === "출하완료"); // 처리 가능
           const invalid = selected.filter(r => r.poStatus !== "출하완료" && r.poStatus !== "입금완료"); // 불가능

           console.log('이미 입금완료:', alreadyPaid.length);
           console.log('출하완료:', canProcess.length);
           console.log('처리 불가:', invalid.length);

           // ✅ 이미 모두 입금완료인 경우
           if (alreadyPaid.length === selected.length) {
             toastr.info(`선택된 ${selected.length}건이 이미 '입금완료' 상태입니다.`);
             return;
           }

           // ❌ 출하완료도 입금완료도 아닌 건이 있으면 에러
           if (invalid.length > 0) {
             console.error('[입금완료 불가] 처리할 수 없는 상태:', invalid);
             toastr.error(`'출하완료' 상태만 입금완료 처리할 수 있습니다.\n선택된 건 중 ${invalid.length}건은 처리할 수 없습니다.`);
             return;
           }

           // 🔔 일부는 이미 입금완료, 일부는 출하완료인 경우
           if (alreadyPaid.length > 0 && canProcess.length > 0) {
             const res = await cuteAlert({
               type: "question",
               title: "입금 확인",
               message: `${alreadyPaid.length}건은 이미 '입금완료' 상태입니다.<br>${canProcess.length}건만 입금완료 처리하시겠습니까?`,
               imgUrl: "https://img.icons8.com/?size=100&id=103807&format=png&color=000000",
               confirmText: "네",
               cancelText: "아니오",
             });
             
             if (!(res === true || res === "confirm")) return;

             // 출하완료 건만 처리
             const processPoCodes = canProcess.map(r => r.poCode);
             setBusy(btnPaymentConfirm, true, "입금확인 처리중...");
             const results = await putPaymentComplete(processPoCodes, "입금완료");
             
             toastr.success(`${results}건 처리완료 (${alreadyPaid.length}건은 이미 처리됨)`);
             if (typeof search === "function") await search();
             return;
           }

           // ✅ 모든 선택 건이 출하완료 상태일 때만 최종 확인
           const res = await cuteAlert({
             type: "question",
             title: "입금 확인",
             message: `선택된 ${poCodes.length}건을 '입금완료'로 변경할까요?`,
             imgUrl: "https://img.icons8.com/?size=100&id=103807&format=png&color=000000",
             confirmText: "네",
             cancelText: "아니오",
           });
           
           if (!(res === true || res === "confirm")) return;

           // API 호출 (입금완료 전용 API)
           setBusy(btnPaymentConfirm, true, "입금확인 처리중...");
           const results = await putPaymentComplete(poCodes, "입금완료");
           
           toastr.success(`${results}건 처리완료`);
           
           // 그리드 새로고침
           if (typeof search === "function") await search();
           
         } catch (e) {
           console.error('[입금완료 에러]', e);
           toastr.error("입금완료 처리 중 오류가 발생했습니다.");
         } finally {
           setBusy(btnPaymentConfirm, false);
         }
       });
        });
      </script>
    </th:block>
  </body>
</html>
