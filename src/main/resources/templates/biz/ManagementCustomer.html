<!DOCTYPE html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}"
>
  <head>
    <meta charset="UTF-8" />
    <title layout:fragment="title">거래처 조회</title>

    <th:block layout:fragment="head_extra">
      <!-- AG Grid CSS -->
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.1/styles/ag-grid.css"
      />
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.1/styles/ag-theme-quartz.css"
      />

      <style>
        #customerGrid.ag-theme-quartz {
          height: 560px;
          width: 100%;
        }
        .btn-filter-group .btn {
          min-width: 108px;
        }
        .form-inline .form-control,
        .form-inline .form-select {
          min-width: 180px;
        }
        .muted {
          color: #6b7280;
          font-size: 12px;
        }
        .text-right {
          text-align: right;
        }
      </style>
    </th:block>
  </head>

  <body>
    <section layout:fragment="content">
      <!-- 검색/필터 -->
      <div class="card shadow mb-4">
        <div
          class="card-header py-3 d-flex align-items-center justify-content-between"
        >
          <h6 class="m-0 font-weight-bold text-primary">거래처 조회</h6>
        </div>

        <div class="card-body">
          <div
            class="btn-filter-group btn-group mb-3"
            role="group"
            aria-label="useYn-filters"
          >
            <button class="btn btn-outline-primary" data-use="">전체</button>
            <button class="btn btn-outline-primary" data-use="Y">사용</button>
            <button class="btn btn-outline-primary" data-use="N">미사용</button>
          </div>

          <div class="form-inline flex-wrap gap-2">
            <label class="mr-2 mb-2">상호</label>
            <input
              id="qName"
              type="text"
              class="form-control mr-3 mb-2"
              placeholder="거래처명(상호)"
            />

            <label class="mr-2 mb-2">대표자명</label>
            <input
              id="qRep"
              type="text"
              class="form-control mr-3 mb-2"
              placeholder="대표자명"
            />

            <label class="mr-2 mb-2">사업자번호</label>
            <input
              id="qBizNo"
              type="text"
              class="form-control mr-3 mb-2"
              placeholder="000-00-00000"
            />

            <label class="mr-2 mb-2">종목</label>
            <input
              id="qType"
              type="text"
              class="form-control mr-3 mb-2"
              placeholder="업종/종목"
            />

            <button id="btnSearch" class="btn btn-dark mb-2">조회</button>
          </div>
        </div>
      </div>

      <!-- 리스트 -->
      <div class="card shadow mb-0">
        <div
          class="card-header py-3 d-flex align-items-center justify-content-between"
        >
          <h6 class="m-0 font-weight-bold text-primary">거래처 리스트</h6>
          <div class="btn-group">
            <button
              id="btnCusRegister"
              type="button"
              class="btn btn-primary btn-slim"
            >
              등록
            </button>
          </div>
        </div>
        <div class="card-body">
          <div id="customerGrid" class="ag-theme-quartz"></div>
        </div>
      </div>

      <!-- 거래처/여신 모달 프래그먼트 -->
      <div th:replace="~{biz/modals/CustomerModal :: mngcustomermodal}"></div>
    </section>

    <th:block layout:fragment="body_extra">
      <!-- libs -->
      <script
        defer
        src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.1/dist/ag-grid-community.min.js"
      ></script>
      <script
        defer
        src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"
      ></script>

      <script th:inline="none">
        document.addEventListener("DOMContentLoaded", () => {
          // ========= helpers =========
          const sel = (q, r = document) => r.querySelector(q);
          const selAll = (q, r = document) => Array.from(r.querySelectorAll(q));
          const limitByGrade = { A: 100_000_000, B: 50_000_000, C: 20_000_000 };
          const toYmd = (v) => {
            if (!v) return "";
            if (typeof v === "string" && v.length >= 10) return v.slice(0, 10);
            const d = new Date(v);
            if (Number.isNaN(d.getTime())) return "";
            const mm = String(d.getMonth() + 1).padStart(2, "0");
            const dd = String(d.getDate()).padStart(2, "0");
            return `${d.getFullYear()}-${mm}-${dd}`;
          };

          // ========= grid =========
          const columnDefs = [
            {
              headerName: "거래처코드",
              field: "cusCode",
              width: 130,
              pinned: "left",
            },
            {
              headerName: "거래처명",
              field: "cusName",
              minWidth: 160,
              flex: 1,
            },
            { headerName: "대표자명", field: "ceoName", width: 110 },
            { headerName: "전화번호", field: "tel", width: 140 },
            { headerName: "주소", field: "addr", minWidth: 220, flex: 1 },
            {
              headerName: "사용여부",
              field: "activeStatus",
              width: 100,
              cellClass: "text-center",
              valueFormatter: (p) =>
                p.value === "Y" ? "Y" : p.value === "N" ? "N" : "",
            },
          ];
          const gridDiv = document.getElementById("customerGrid");
          let gridApi;
          const gridOptions = {
            columnDefs,
            rowData: [],
            rowSelection: "single",
            pagination: true,
            paginationPageSize: 12,
            defaultColDef: { sortable: true, resizable: true, filter: true },
            onGridReady: (p) => {
              gridApi = p.api;
              search();
            },
            onRowClicked: (e) => {
              if (e?.data) openCustomerModal("edit", e.data);
            },
          };
          if (window.agGrid?.createGrid)
            gridApi = agGrid.createGrid(gridDiv, gridOptions);
          else {
            new agGrid.Grid(gridDiv, gridOptions);
            gridApi = gridOptions.api;
          }
          const setRows = (rows) =>
            gridApi?.setGridOption
              ? gridApi.setGridOption("rowData", rows)
              : gridApi.setRowData(rows);

          // ========= search =========
          const qName = sel("#qName"),
            qRep = sel("#qRep"),
            qBizNo = sel("#qBizNo"),
            qType = sel("#qType");
          const btnSearch = sel("#btnSearch");
          let useYn = "";
          selAll(".btn-filter-group [data-use]").forEach((btn) => {
            btn.addEventListener("click", () => {
              useYn = btn.getAttribute("data-use") || "";
              search();
            });
          });
          btnSearch.addEventListener("click", () => search());
          [qName, qRep, qBizNo, qType].forEach((el) => {
            el.addEventListener("keydown", (e) => {
              if (e.key === "Enter") search();
            });
          });

          async function search() {
            try {
              const params = {
                activeStatus: (useYn ?? "").toString(),
                name: (qName.value || "").trim(),
                rep: (qRep.value || "").trim(),
                bizNo: (qBizNo.value || "").trim(),
                type: (qType.value || "").trim(),
              };
              const res = await axios.get("/api/biz/mngcustomer", {
                params,
                withCredentials: true,
              });
              const rows = Array.isArray(res.data) ? res.data : [];
              const mapped = rows.map((r) => {
                const cr = r.credit || {};
                return {
                  cusCode: r.cusCode ?? "",
                  empName: r.empName ?? "",
                  cusName: r.cusName ?? "",
                  bizNo: r.bizNo ?? "",
                  ceoName: r.ceoName ?? "",
                  bizType: r.bizType ?? "",
                  bizCategory: r.bizCategory ?? "",
                  tel: r.tel ?? "",
                  addr: r.addr ?? "",
                  zipCode: r.zipCode ?? "",
                  activeStatus: r.activeStatus ?? "Y",
                  bankName: r.bankName ?? "",
                  bankAccount: r.bankAccount ?? "",
                  // 여신
                  creditLimit: cr.creditLimit ?? null,
                  creditGrade: cr.creditGrade ?? null,
                  startDate: cr.startDate ?? null,
                  expireDate: cr.expireDate ?? null,
                  cActiveStatus: cr.cActiveStatus ?? null,
                  credit: cr,
                };
              });
              setRows(mapped);
            } catch (err) {
              console.error(err);
              setRows([]);
            }
          }

          // ========= modal/tabs =========
          const customerModalEl = document.getElementById("mngcustomermodal");
          const bsCustomerModal = () =>
            new bootstrap.Modal(customerModalEl, {
              backdrop: "static",
              keyboard: false,
            });

          const tabInfoBtn = sel("#tabInfoBtn"),
            tabCreditBtn = sel("#tabCreditBtn");
          const paneInfo = sel("#paneInfo"),
            paneCredit = sel("#paneCredit");
          function activateInfoTab() {
            tabInfoBtn.classList.remove("btn-outline-secondary");
            tabInfoBtn.classList.add("btn-primary");
            tabCreditBtn.classList.remove("btn-primary");
            tabCreditBtn.classList.add("btn-outline-secondary");
            paneInfo.classList.remove("d-none");
            paneCredit.classList.add("d-none");
          }
          function activateCreditTab() {
            tabCreditBtn.classList.remove("btn-outline-secondary");
            tabCreditBtn.classList.add("btn-primary");
            tabInfoBtn.classList.remove("btn-primary");
            tabInfoBtn.classList.add("btn-outline-secondary");
            paneCredit.classList.remove("d-none");
            paneInfo.classList.add("d-none");
          }
          tabInfoBtn.addEventListener("click", activateInfoTab);
          tabCreditBtn.addEventListener("click", activateCreditTab);

          // 여신 DOM
          // ========= form refs =========
          const customerForm = sel("#customerForm");
          const creditGradeEl = sel("#creditGrade");
          const creditLimitEl = sel("#creditLimit");
          const startDateEl = sel("#startDate");
          const expireDateEl = sel("#expireDate");
          const cActiveStatusEl = sel("#cActiveStatus");

          // 여신초기값
          // ========= form utils =========
          function resetCustomerForm() {
            customerForm.reset();
            sel("#activeStatus").value = "Y";
            sel("#cusCode").value = "등록후 생성";
            creditGradeEl.value = "C";
            creditLimitEl.value = limitByGrade["C"] ?? 0;
            startDateEl.value = "";
            expireDateEl.value = "";
            cActiveStatusEl.value = "Y";
          }

          // 거래처 DOM
          function fillCustomerForm(row = {}) {
            sel("#cusCode").value = row.cusCode ?? "";
            sel("#empName").value = row.empName ?? "";
            sel("#cusName").value = row.cusName ?? "";
            sel("#bizNo").value = row.bizNo ?? "";
            sel("#ceoName").value = row.ceoName ?? "";
            sel("#bizType").value = row.bizType ?? "";
            sel("#bizCategory").value = row.bizCategory ?? "";
            sel("#tel").value = row.tel ?? "";
            sel("#email").value = row.email ?? "";
            sel("#addr").value = row.addr ?? "";
            sel("#zipCode").value = row.zipCode ?? "";
            sel("#activeStatus").value = row.activeStatus ?? "Y";
            sel("#bankName").value = row.bankName ?? "";
            sel("#bankAccount").value = row.bankAccount ?? "";
          }

          // 여신탭 초기값
          function fillCreditForm(cr) {
            if (!cr) {
              creditGradeEl.value = "C";
              creditLimitEl.value = limitByGrade["C"] ?? 0;
              startDateEl.value = "";
              expireDateEl.value = "";
              cActiveStatusEl.value = "Y";
              return;
            }
            creditGradeEl.value = cr.creditGrade ?? "C";
            creditLimitEl.value = cr.creditLimit ?? limitByGrade["C"] ?? 0;
            startDateEl.value = toYmd(cr.startDate);
            expireDateEl.value = toYmd(cr.expireDate);
            cActiveStatusEl.value = cr.cActiveStatus;
          }

          function collectCustomerPayload() {
            const cusCodeDom = sel("#cusCode").value;
            return {
              cusCode: cusCodeDom === "등록후 생성" ? "" : cusCodeDom,
              empName: sel("#empName").value,
              cusName: sel("#cusName").value,
              bizNo: sel("#bizNo").value,
              ceoName: sel("#ceoName").value,
              bizType: sel("#bizType").value,
              bizCategory: sel("#bizCategory").value,
              tel: sel("#tel").value,
              email: sel("#email").value,
              addr: sel("#addr").value,
              zipCode: sel("#zipCode").value,
              activeStatus: sel("#activeStatus").value,
              bankName: sel("#bankName").value,
              bankAccount: sel("#bankAccount").value,
            };
          }

          function collectCreditPayload() {
            return {
              creditGrade: creditGradeEl.value,
              creditLimit: Number(creditLimitEl.value || 0),
              startDate: startDateEl.value, // "YYYY-MM-DD"
              expireDate: expireDateEl.value, // "YYYY-MM-DD"
              cActiveStatus: cActiveStatusEl.value,
            };
          }

          // ========= modal open =========
          function setModalMode(mode) {
            const el = document.getElementById("mngcustomermodal");
            if (!el) {
              console.error("[mngcustomermodal] 모달 루트 없음");
              return;
            }
            el.dataset.mode = mode;
            const titleEl = el.querySelector(".modal-title");
            const submitEl = el.querySelector("#btnSubmitCustomer");
            const codeEl = el.querySelector("#cusCode");
            if (mode === "create") {
              titleEl && (titleEl.textContent = "거래처 등록");
              submitEl && (submitEl.textContent = "저장");
              codeEl && (codeEl.value = "등록후 생성");
            } else {
              titleEl && (titleEl.textContent = "거래처/여신 수정");
              submitEl && (submitEl.textContent = "저장");
            }
          }

          async function openCustomerModal(mode, row) {
            setModalMode(mode);
            resetCustomerForm();
            if (mode === "edit" && row) {
              fillCustomerForm(row);
              fillCreditForm(row.credit || null);
            } else {
              fillCreditForm(null);
            }
            activateInfoTab();
            bsCustomerModal().show();
          }

          // ========= actions =========
          sel("#btnCusRegister").addEventListener("click", () =>
            openCustomerModal("create", null)
          );
          sel("#btnFormReset").addEventListener("click", () => {
            resetCustomerForm();
            sel("#activeStatus").value = "Y";
          });

          // 여신 단독 업데이트 (수정 탭에서만 사용)
          async function updateCreditStandalone(cusCode) {
            if (!cusCode || cusCode === "등록후 생성") {
              alert("먼저 거래처를 저장해 거래처코드를 생성하세요.");
              return false;
            }
            const payload = collectCreditPayload();
            if (payload.creditLimit < 0) {
              alert("여신한도는 0 이상이어야 합니다.");
              return false;
            }
            if (
              payload.startDate &&
              payload.expireDate &&
              payload.startDate > payload.expireDate
            ) {
              alert("종료일이 시작일보다 빠를 수 없습니다.");
              return false;
            }
            console.log("[PUT] /api/biz/mngcuscredit", cusCode, payload);
            try {
              await axios.put(
                `/api/biz/mngcuscredit/${encodeURIComponent(cusCode)}`,
                payload
              );
              alert("여신이 수정되었습니다.");
              return true;
            } catch (err) {
              console.error(err);
              if (err?.response?.status === 404)
                alert(
                  "해당 거래처의 여신 정보가 없습니다. 먼저 여신을 등록하세요."
                );
              else alert("여신 수정에 실패했습니다.");
              return false;
            }
          }

          // 현재 여신 탭이 활성인지
          function isCreditTabActive() {
            return !document
              .getElementById("paneCredit")
              .classList.contains("d-none");
          }

          // 고객 저장 (POST/PUT)
          async function saveCustomer(mode, customer) {
            if (mode === "create") {
              await axios.post("/api/biz/mngcustomer", customer);
            } else {
              await axios.put(
                `/api/biz/mngcustomer/${encodeURIComponent(customer.cusCode)}`,
                customer
              );
            }
          }

          // 저장 버튼 하나로 분기 (create: 고객+여신, edit: 탭 기준)
          sel("#btnSubmitCustomer").addEventListener("click", async () => {
            const mode = customerModalEl.dataset.mode || "create";
            if (!customerForm.cusName.value.trim()) {
              alert("상호는 필수입니다.");
              customerForm.cusName.focus();
              return;
            }
            try {
              if (mode === "create") {
                const customer = collectCustomerPayload();
                customer.credit = collectCreditPayload(); // 신규는 함께 저장
                await saveCustomer("create", customer);
              } else {
                if (isCreditTabActive()) {
                  const cusCode = sel("#cusCode")?.value?.trim();
                  const ok = await updateCreditStandalone(cusCode); // 여신만 저장
                  if (!ok) return;
                } else {
                  const customer = collectCustomerPayload(); // 고객만 저장
                  await saveCustomer("edit", customer);
                }
              }
              bootstrap.Modal.getInstance(customerModalEl)?.hide();
              search();
            } catch (err) {
              console.error(err);
              alert("저장에 실패했습니다.");
            }
          });

          // modal hooks
          customerModalEl.addEventListener("show.bs.modal", () =>
            activateInfoTab()
          );
          customerModalEl.addEventListener("hidden.bs.modal", () => {
            resetCustomerForm();
            customerModalEl.dataset.mode = "create";
          });
        });
      </script>
    </th:block>
  </body>
</html>
