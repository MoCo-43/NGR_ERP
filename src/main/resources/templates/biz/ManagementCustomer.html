<!DOCTYPE html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}"
>
  <head>
    <meta charset="UTF-8" />
    <title layout:fragment="title">거래처 조회</title>

    <th:block layout:fragment="head_extra">
      <!-- AG Grid CSS -->
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.1/styles/ag-grid.css"
      />
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.1/styles/ag-theme-quartz.css"
      />
	<!-- Toastr CSS -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.css">
      <style>
        #customerGrid.ag-theme-quartz {
          height: 560px;
          width: 100%;
        }
        .form-inline .form-control,
        .form-inline .form-select {
          min-width: 180px;
        }
        .muted {
          color: #6b7280;
          font-size: 12px;
        }
        .text-right {
          text-align: right;
        }
      </style>
    </th:block>
  </head>

  <body>
    <section layout:fragment="content">
      <!-- 거래처코드 들고오기 -->
      <input id="cusCode" type="hidden" />

      <!-- 검색/필터 -->
      <div class="card shadow mb-4">
        <div
          class="card-header py-3 d-flex align-items-center justify-content-between"
        >
          <h6 class="m-0 font-weight-bold text-primary">거래처 조회</h6>
        </div>

        <div class="card-body">
          <!-- 검색필터: 상호 / 대표자명 / 구분(구매처·판매처) -->
          <div class="form-inline flex-wrap gap-2">
            <label class="mr-2 mb-2" for="qName">상호</label>
            <input
              id="qName"
              type="text"
              class="form-control mr-3 mb-2"
              placeholder="거래처명(상호)"
            />

            <label class="mr-2 mb-2" for="qRep">대표자명</label>
            <input
              id="qRep"
              type="text"
              class="form-control mr-3 mb-2"
              placeholder="대표자명"
            />

            <label class="mr-2 mb-2" for="qGbn">구분</label>
            <select id="qGbn" class="form-select mr-3 mb-2">
              <option value="">전체</option>
              <option value="구매처">구매처</option>
              <option value="판매처">판매처</option>
            </select>

            <button id="btnSearch" class="btn btn-dark mb-2">조회</button>
            <button id="btnResetFilter" class="btn btn-danger mb-2">초기화</button>
            <div class="btn-group ml-2">
              <button
                id="btnCusRegister"
                type="button"
                class="btn btn-primary mb-2"
              >
                거래처 등록
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- 그리드 리스트 -->
      <!-- 로딩바 구역 -->
      <div
        id="customerGridLoader"
        style="position: relative; width: 100%; max-height: 500px"
      >
        <div id="customerGrid" class="ag-theme-quartz"></div>
        <!-- 로딩 스피너 -->
        <div id="loaderBsModal" class="loader-overlay" style="display: none">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      </div>

      <!-- 거래처/여신 모달 프래그먼트 -->
      <div th:replace="~{biz/modals/CustomerModal :: mngcustomermodal}"></div>
    </section>

    <th:block layout:fragment="body_extra">
      <!-- 라이브러리 -->
      <script
        defer
        src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.1/dist/ag-grid-community.min.js"
      ></script>
      <script
        defer
        src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"
      ></script>
      <!--  toastr  -->
	<script src="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.js"></script>

      <!-- 세션 정보 저장 -->
      <script th:inline="javascript">
        const loginName =
          /*[[${#authentication.principal.empLoginVO.name}]]*/ "";
        const compCode =
          /*[[${#authentication.principal.empLoginVO.matNo}]]*/ "";
      </script>

      <script th:inline="none">
      // 검색필터 DOM
		const norm = (v) => String(v ?? "").trim().toLowerCase();
		const includes = (src, q) => !q || norm(src).includes(q);
		const isGbnMatch = (rowGbn, selected) => {
		  if (!selected) return true;
		  const g = norm(rowGbn);
		  const s = norm(selected);
		  if (g === s) return true;
		  if ((s === "구매처" && (g === "구매처" || g === "buy")) ||
		      (s === "판매처" && (g === "판매처" || g === "sell"))) return true;
		  if ((s === "buy" && (g === "buy" || g === "구매처")) ||
		      (s === "sell" && (g === "sell" || g === "판매처"))) return true;
		  return false;
		};
		let ALL_ROWS = []; // 전체 데이터 캐시
		
		function mapRows(rows) {
		  return rows.map((r) => {
		    const cr = r.credit || {};
		    return {
		     // 거래처
		      gbn: r.gbn ?? "",
		      cusCode: r.cusCode ?? "",
		      empName: r.empName ?? "",
		      cusName: r.cusName ?? "",
		      bizNo: r.bizNo ?? "",
		      ceoName: r.ceoName ?? "",
		      bizType: r.bizType ?? "",
		      bizCategory: r.bizCategory ?? "",
		      tel: r.tel ?? "",
		      addr: r.addr ?? "",
		      zipCode: r.zipCode ?? "",
		      activeStatus: r.activeStatus ?? "Y",
		      bankName: r.bankName ?? "",
		      bankAccount: r.bankAccount ?? "",
		      // 여신
		      creditLimit: cr.creditLimit ?? null,
		      creditGrade: cr.creditGrade ?? null,
		      startDate: cr.startDate ?? null,
		      expireDate: cr.expireDate ?? null,
		      cActiveStatus: cr.cActiveStatus ?? null,
		      credit: cr,
		    };
		  });
		}
      
      
      
        document.addEventListener("DOMContentLoaded", () => {
          // ========= DOM helpers =========
          const sel = (q, r = document) => r.querySelector(q);
          const selAll = (q, r = document) => Array.from(r.querySelectorAll(q));
          const limitByGrade = { A: 100_000_000, B: 50_000_000, C: 20_000_000 };
          const toYmd = (v) => {
            if (!v) return "";
            if (typeof v === "string" && v.length >= 10) return v.slice(0, 10);
            const d = new Date(v);
            if (Number.isNaN(d.getTime())) return "";
            const mm = String(d.getMonth() + 1).padStart(2, "0");
            const dd = String(d.getDate()).padStart(2, "0");
            return `${d.getFullYear()}-${mm}-${dd}`;
          };

          // ========= 거래처 리스트 그리드 =========
          const columnDefs = [
            { headerName: "거래처코드", field: "cusCode", width: 130, pinned: "left" },
            { headerName: "거래처명", field: "cusName", minWidth: 160, flex: 1 },
            { headerName: "대표자명", field: "ceoName", width: 110 },
            { headerName: "전화번호", field: "tel", width: 140 },
            { headerName: "주소", field: "addr", minWidth: 220, flex: 1 },
            { headerName: "구분", field: "gbn", flex: 1 },
            {
              headerName: "사용여부",
              field: "activeStatus",
              width: 100,
              cellClass: "text-center",
              valueFormatter: (p) => (p.value === "Y" ? "Y" : p.value === "N" ? "N" : ""),
            },
          ];

          const gridDiv = document.getElementById("customerGrid");
          let gridApi;
          const gridOptions = {
            columnDefs,
            rowData: [],
            rowSelection: "single",
            pagination: true,
            paginationPageSize: 12,
            defaultColDef: { sortable: true, resizable: true, filter: true },
            onGridReady: (p) => {
              gridApi = p.api;
              search();
            },
            onRowClicked: (e) => {
              if (e?.data) openCustomerModal("edit", e.data);
            },
          };

          if (window.agGrid?.createGrid) {
            gridApi = agGrid.createGrid(gridDiv, gridOptions);
          } else {
            new agGrid.Grid(gridDiv, gridOptions);
            gridApi = gridOptions.api;
          }

          const setRows = (rows) =>
            gridApi?.setGridOption
              ? gridApi.setGridOption("rowData", rows)
              : gridApi.setRowData(rows);

          // ========= search =========
          const qName = sel("#qName");
          const qRep = sel("#qRep");
          const qGbn = sel("#qGbn");
          const btnSearch = sel("#btnSearch");

          const val = (el) => (el?.value ?? "").trim();

          // Enter로 조회
          [qName, qRep].forEach((el) => {
            el?.addEventListener("keydown", (e) => {
              if (e.key === "Enter") search();
            });
          });

          // 구분 변경 시 자동 조회 (원치 않으면 주석)
          qGbn?.addEventListener("change", () => search());

          // 조회 버튼
          btnSearch?.addEventListener("click", () => search());

          // 그리드 표시 및 검색기능
		async function search() {
		  try {
		    // 1) 전체 로드 (파라미터 안 보냄) — 최초 1회만
		    if (!ALL_ROWS.length) {
		      try { showLoader("customerGridLoader", "거래처 전체를 불러오는 중입니다..."); } catch(_) {}
		      const res = await axios.get("/api/biz/mngcustomer", {
		        withCredentials: true,
		        headers: { "Cache-Control": "no-cache" },
		      });
		      const rows = Array.isArray(res.data) ? res.data : [];
		      ALL_ROWS = mapRows(rows);
		    }
		
		    // 2) 클라이언트 필터 적용
		    const nameQ = norm(qName?.value);
		    const repQ  = norm(qRep?.value);
		    const gbnQ  = (qGbn?.value ?? "").trim();
		
		    const filtered = ALL_ROWS.filter((r) =>
		      includes(r.cusName, nameQ) &&
		      includes(r.ceoName, repQ) &&
		      isGbnMatch(r.gbn, gbnQ)
		    );
		
		    setRows(filtered);
		
		    if (filtered.length === 0) {
		      // 결과 없음은 cuteAlert로
		      typeof cuteAlert === "function" && cuteAlert({
		        type: "info",
		        title: "검색 결과 없음",
		        message: "조건에 해당하는 거래처가 없습니다.",
		        buttonText: "확인",
		        imgUrl: "https://img.icons8.com/?size=100&id=I1i97v6fS0hW&format=png&color=007BFF",
		      });
		    }
		  } catch (err) {
		    console.error(err);
		    setRows([]);
		    toastr?.error?.("검색 중 오류가 발생했습니다.");
		  } finally {
		    try { hideLoader("customerGridLoader"); } catch(_) {}
		  }
		}

		// ========= 검색 필터 초기화 =========
		const btnResetFilter = sel("#btnResetFilter");

		btnResetFilter?.addEventListener("click", () => {
		  // 입력창과 셀렉트 초기화
		  qName.value = "";
		  qRep.value = "";
		  qGbn.value = "";

		  // 전체 목록 다시 보여주기
		  if (typeof ALL_ROWS !== "undefined" && Array.isArray(ALL_ROWS)) {
		    setRows(ALL_ROWS);
		  }
		});
          
          
          // ========= 거래처 및 여신등록 모달탭 설정 =========
          const customerModalEl = document.getElementById("mngcustomermodal");
          const bsCustomerModal = () =>
            new bootstrap.Modal(customerModalEl, { backdrop: "static", keyboard: false });

          const tabInfoBtn = sel("#tabInfoBtn"),
            tabCreditBtn = sel("#tabCreditBtn");
          const paneInfo = sel("#paneInfo"),
            paneCredit = sel("#paneCredit");

          function activateInfoTab() {
            tabInfoBtn.classList.remove("btn-outline-secondary");
            tabInfoBtn.classList.add("btn-primary");
            tabCreditBtn.classList.remove("btn-primary");
            tabCreditBtn.classList.add("btn-outline-secondary");
            paneInfo.classList.remove("d-none");
            paneCredit.classList.add("d-none");
          }
          function activateCreditTab() {
            tabCreditBtn.classList.remove("btn-outline-secondary");
            tabCreditBtn.classList.add("btn-primary");
            tabInfoBtn.classList.remove("btn-primary");
            tabInfoBtn.classList.add("btn-outline-secondary");
            paneCredit.classList.remove("d-none");
            paneInfo.classList.add("d-none");
          }
          tabInfoBtn?.addEventListener("click", activateInfoTab);
          tabCreditBtn?.addEventListener("click", activateCreditTab);

          // ========= form refs =========
          const customerForm = sel("#customerForm");
          const creditGradeEl = sel("#creditGrade");
          const creditLimitEl = sel("#creditLimit");
          const startDateEl = sel("#startDate");
          const expireDateEl = sel("#expireDate");
          const cActiveStatusEl = sel("#cActiveStatus");

          // ========= form utils =========
          function resetCustomerForm() {
            customerForm?.reset?.();
            sel("#activeStatus").value = "Y";
            if (creditGradeEl) creditGradeEl.value = "C";
            if (creditLimitEl) creditLimitEl.value = limitByGrade["C"] ?? 0;
            if (startDateEl) startDateEl.value = "";
            if (expireDateEl) expireDateEl.value = "";
            if (cActiveStatusEl) cActiveStatusEl.value = "Y";
          }

          function fillCustomerForm(row = {}) {
            sel("#cusCode").value = row.cusCode ?? "";
            sel("#gbn").value = row.gbn ?? "";
            sel("#empName").value = row.empName ?? "";
            sel("#cusName").value = row.cusName ?? "";
            sel("#bizNo").value = row.bizNo ?? "";
            sel("#ceoName").value = row.ceoName ?? "";
            sel("#bizType").value = row.bizType ?? "";
            sel("#bizCategory").value = row.bizCategory ?? "";
            sel("#tel").value = row.tel ?? "";
            sel("#email").value = row.email ?? "";
            sel("#addr").value = row.addr ?? "";
            sel("#zipCode").value = row.zipCode ?? "";
            sel("#activeStatus").value = row.activeStatus ?? "Y";
            sel("#bankName").value = row.bankName ?? "";
            sel("#bankAccount").value = row.bankAccount ?? "";
          }

          function fillCreditForm(cr) {
            if (!cr) {
              if (creditGradeEl) creditGradeEl.value = "C";
              if (creditLimitEl) creditLimitEl.value = limitByGrade["C"] ?? 0;
              if (startDateEl) startDateEl.value = "";
              if (expireDateEl) expireDateEl.value = "";
              if (cActiveStatusEl) cActiveStatusEl.value = "Y";
              return;
            }
            if (creditGradeEl) creditGradeEl.value = cr.creditGrade ?? "C";
            if (creditLimitEl)
              creditLimitEl.value = cr.creditLimit ?? limitByGrade["C"] ?? 0;
            if (startDateEl) startDateEl.value = toYmd(cr.startDate);
            if (expireDateEl) expireDateEl.value = toYmd(cr.expireDate);
            if (cActiveStatusEl) cActiveStatusEl.value = cr.cActiveStatus ?? "Y";
          }

          function collectCustomerPayload() {
            const cusCode = sel("#cusCode")?.value?.trim();
            return {
              cusCode,
              gbn: sel("#gbn").value,
              empName: sel("#empName").value,
              cusName: sel("#cusName").value,
              bizNo: sel("#bizNo").value,
              ceoName: sel("#ceoName").value,
              bizType: sel("#bizType").value,
              bizCategory: sel("#bizCategory").value,
              tel: sel("#tel").value,
              email: sel("#email").value,
              addr: sel("#addr").value,
              zipCode: sel("#zipCode").value,
              activeStatus: sel("#activeStatus").value,
              bankName: sel("#bankName").value,
              bankAccount: sel("#bankAccount").value,
            };
          }

          function collectCreditPayload() {
            return {
              creditGrade: creditGradeEl?.value,
              creditLimit: Number(creditLimitEl?.value || 0),
              startDate: startDateEl?.value,
              expireDate: expireDateEl?.value,
              cActiveStatus: cActiveStatusEl?.value,
            };
          }

          function setModalMode(mode) {
            const el = document.getElementById("mngcustomermodal");
            if (!el) {
              console.error("[mngcustomermodal] 모달 루트 없음");
              return;
            }
            el.dataset.mode = mode;
            const titleEl = el.querySelector(".modal-title");
            const submitEl = el.querySelector("#btnSubmitCustomer");
            const codeEl = el.querySelector("#cusCode");
            if (mode === "create") {
              titleEl && (titleEl.textContent = "거래처 등록");
              submitEl && (submitEl.textContent = "저장");
              codeEl && (codeEl.value = "등록후 생성");
            } else {
              titleEl && (titleEl.textContent = "거래처/여신 수정");
              submitEl && (submitEl.textContent = "저장");
            }
          }

          async function openCustomerModal(mode, row) {
            setModalMode(mode);
            resetCustomerForm();
            if (mode === "edit" && row) {
              fillCustomerForm(row);
              fillCreditForm(row.credit || null);
            } else {
              fillCreditForm(null);
            }
            activateInfoTab();
            bsCustomerModal().show();
          }

          sel("#btnCusRegister")?.addEventListener("click", () =>
            openCustomerModal("create", null)
          );
          sel("#btnFormReset")?.addEventListener("click", () => {
            resetCustomerForm();
            sel("#activeStatus").value = "Y";
          });

          async function updateCreditStandalone(cusCode) {
            if (!cusCode || cusCode === "등록후 생성") {
              toastr.warning("먼저 거래처를 저장해 거래처코드를 생성하세요.");
              return false;
            }
            const payload = collectCreditPayload();
            if (payload.creditLimit < 0) {
              toastr.warning("여신한도는 0 이상이어야 합니다.");
              return false;
            }
            if (
              payload.startDate &&
              payload.expireDate &&
              payload.startDate > payload.expireDate
            ) {
              toastr.error("종료일이 시작일보다 빠를 수 없습니다.");
              return false;
            }
            try {
                const res = await cuteAlert({
                    type: "question",
                    title: "여신변경",
                    message: "여신변경을 하시겠습니까?",
                    imgUrl: 'https://img.icons8.com/?size=100&id=103807&format=png&color=000000',
                    confirmText: "네",
                    cancelText: "아니오"
                  });
                  if (res !== true) return;
              await axios.put(
                `/api/biz/mngcuscredit/${encodeURIComponent(cusCode)}`,
                payload
              );
              toastr.success("여신이 수정되었습니다.");
              return true;
            } catch (err) {
              console.error(err);
              if (err?.response?.status === 404)
                toastr.error("해당 거래처의 여신 정보가 없습니다. 먼저 여신을 등록하세요.");
              else toastr.error("여신 수정에 실패했습니다.");
              return false;
            }
          }

          function isCreditTabActive() {
            return !document.getElementById("paneCredit")?.classList.contains("d-none");
          }

          async function saveCustomer(mode, customer) {
            if (mode === "create") {
                const res = await cuteAlert({
                    type: "question",
                    title: "거래처 등록",
                    message: "거래처 등록 하시겠습니까?",
                    imgUrl: 'https://img.icons8.com/?size=100&id=103807&format=png&color=000000',
                    confirmText: "네",
                    cancelText: "아니오"
                  });
                  if (res !== true) return;
              await axios.post("/api/biz/mngcustomer", customer);
              toastr.success("거래처가 정상적으로 등록되었습니다.");
            } else {
                const res = await cuteAlert({
                    type: "question",
                    title: "거래처내용 수정",
                    message: "거래처내용 수정 하시겠습니까?",
                    imgUrl: 'https://img.icons8.com/?size=100&id=103807&format=png&color=000000',
                    confirmText: "네",
                    cancelText: "아니오"
                  });
                  if (res !== true) return;
              await axios.put(
                `/api/biz/mngcustomer/${encodeURIComponent(customer.cusCode)}`,
                customer
              );
              toastr.success("거래처내용이 정상적으로 수정되었습니다.");
            }
          }

          sel("#btnSubmitCustomer")?.addEventListener("click", async () => {
            const mode = customerModalEl?.dataset?.mode || "create";
            if (!customerForm?.cusName?.value?.trim()) {
              toastr.warning("상호는 필수입니다.");
              customerForm.cusName.focus();
              return;
            }
            try {
              if (mode === "create") {
                const customer = collectCustomerPayload();
                customer.credit = collectCreditPayload(); // 신규는 함께 저장
                await saveCustomer("create", customer);
              } else {
                if (isCreditTabActive()) {
                  const cusCode = sel("#cusCode")?.value?.trim();
                  const ok = await updateCreditStandalone(cusCode); // 여신만 저장
                  if (!ok) return;
                } else {
                  const customer = collectCustomerPayload(); // 고객만 저장
                  await saveCustomer("edit", customer);
                }
              }
              bootstrap.Modal.getInstance(customerModalEl)?.hide();
              search();
            } catch (err) {
              console.error(err);
              toastr.error("저장에 실패했습니다.");
            }
          });

          customerModalEl?.addEventListener("show.bs.modal", () => activateInfoTab());
          customerModalEl?.addEventListener("hidden.bs.modal", () => {
            resetCustomerForm();
            customerModalEl.dataset.mode = "create";
          });
        });
      </script>
    </th:block>
  </body>
</html>
